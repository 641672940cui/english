<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Day 1 · 基础营</title>
  <style>
    /* 复用之前的样式，确保单独打开也好看 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f5fb; padding: 14px 10px 30px; color: #1a2a3a; }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.4rem; color: #0b2b4a; border-left: 6px solid #2a7faa; padding-left: 14px; margin-bottom: 14px; }
    .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.05); }
    .card-title { font-weight: 700; font-size: 1.2rem; color: #134b6b; margin-bottom: 14px; border-bottom: 2px solid #e3edf5; padding-bottom: 8px; }
    
    .learn-card { background: #fafdff; border: 1px solid #e3ecf5; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .learn-title { font-size: 1.15rem; font-weight: 700; color: #b13e2e; }
    .learn-en { font-size: 0.85rem; color: #1f5880; font-weight: 600; background: #e3edf5; display: inline-block; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
    .learn-img { font-size: 0.9rem; color: #5c4328; margin: 8px 0; background: #fdfaf2; padding: 8px 10px; border-radius: 8px; border-left: 3px solid #d48c5c; }
    .family-toggle { display: block; width: 100%; background: #e3edf5; border: none; padding: 8px; border-radius: 8px; font-size: 0.85rem; color: #1f5880; font-weight: 600; cursor: pointer; margin-top: 10px; text-align: center; }
    .family-list { display: none; list-style: none; padding: 0; margin-top: 10px; border-top: 1px dashed #d0dfec; padding-top: 10px; }
    .family-list.open { display: block; }
    .family-list li { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 6px 0; border-bottom: 1px dotted #e0eaf2; }
    .fam-word { font-weight: 600; color: #b13e2e; width: 120px; }
    .fam-break { color: #666; flex: 1; font-size: 0.82rem; margin-left: 8px; }
    
    .quiz-card { background: #f8fbff; border: 1px solid #d5e4f1; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .quiz-question { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; }
    .quiz-opt { background: white; border: 1px solid #c9dae8; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; margin-bottom: 8px; }
    .quiz-opt.correct { background: #d4edda; border-color: #28a745; }
    .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; }
    .quiz-explain { display: none; margin-top: 10px; font-size: 0.85rem; color: #1a4d6b; background: #e3edf5; padding: 8px; border-radius: 8px; }
    .quiz-explain.show { display: block; }
    .score-board { background: #e3edf5; padding: 8px 16px; border-radius: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 16px; }
    .btn { background: #1f5880; color: white; border: none; padding: 12px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn-next { background: #1a7a3a; }
  </style>
</head>
<body>
<div class="container">
  <h1>Day 1 · 基础营</h1>
  <div class="card">
    <div class="card-title">1. 认零件 (前缀)</div>
    <div id="learnContainer"></div>
    <button class="btn" onclick="switchTab('quiz')">✅ 学完了，去刷题 (15题)</button>
  </div>
  <div class="card" id="quizCard" style="display:none;">
    <div class="card-title">2. 刷题库</div>
    <div class="score-board"><span>📊 得分: <strong id="scoreDisplay">0</strong> / 15</span><span id="progressText">进度: 0%</span></div>
    <div id="quizContainer"></div>
    <button class="btn btn-next" id="btnFinish" style="display:none;" onclick="location.reload()">🏆 完成 Day 1</button>
  </div>
</div>

<script>
// ================== Day 1 专属数据 ==================
const learnData = {
  prefixes: [
    { p: "in- / im-", en: "not / in", img: "否定：不；方向：向内、进入", origin: "源自拉丁语 in-。作为否定前缀时，与古英语 un- 同源。", ex: "invisible, import" },
    { p: "re-", en: "again / back", img: "向后 / 再次", origin: "源自拉丁语 re-。", ex: "return, review" },
    { p: "pre-", en: "before / in front", img: "在前 / 预先", origin: "源自拉丁语 prae。", ex: "predict, prepare" }
  ],
  roots: [
    { r: "scrib / script", en: "write", img: "古罗马人在蜡板上 '划' 出痕迹，画面是 '写'。", origin: "源自拉丁语 scribere。", family: [{w:"subscribe",b:"sub(在下)+scrib",m:"v. 订阅"},{w:"describe",b:"de(向下)+scrib",m:"v. 描述"},{w:"prescribe",b:"pre(预先)+scrib",m:"v. 开处方"},{w:"script",b:"script",m:"n. 脚本"},{w:"manuscript",b:"manu(手)+script",m:"n. 手稿"}] },
    { r: "spect / spic", en: "look / see", img: "目光向某个方向投射出去， '看'。", origin: "源自拉丁语 specere。", family: [{w:"inspect",b:"in(向内)+spect",m:"v. 检查"},{w:"respect",b:"re(再次)+spect",m:"v. 尊敬"},{w:"suspect",b:"su(下面)+spect",m:"v. 怀疑"},{w:"prospect",b:"pro(向前)+spect",m:"n. 前景"},{w:"spectator",b:"spect+ator(人)",m:"n. 观众"}] },
    { r: "tract", en: "pull / draw", img: "磁铁把东西 '拉' 过来。", origin: "源自拉丁语 trahere。", family: [{w:"attract",b:"at(朝向)+tract",m:"v. 吸引"},{w:"distract",b:"dis(分开)+tract",m:"v. 分心"},{w:"extract",b:"ex(向外)+tract",m:"v. 提取"},{w:"contract",b:"con(共同)+tract",m:"n. 合同"},{w:"abstract",b:"abs(离开)+tract",m:"adj. 抽象的"}] }
  ]
};

const quizData = [
  { q: "前缀 're-' 的核心英文含义是？", opts: ["A. not", "B. again / back", "C. before", "D. under"], ans: 1, exp: "re- = 向后/再次。" },
  { q: "前缀 'pre-' 的画面感是？", opts: ["A. 站在前面/预先", "B. 在下面", "C. 共同", "D. 向外"], ans: 0, exp: "pre- 站在最前面。" },
  { q: "单词 invisible 中的前缀 'in-' 的意思是？", opts: ["A. 向内", "B. 否定 (不)", "C. 进入", "D. 强调"], ans: 1, exp: "in(不) + vis(看) ➡️ 看不见的。" },
  { q: "单词 import 中的 'im-' 代表什么画面？", opts: ["A. 不", "B. 向内 / 进入", "C. 在外", "D. 离开"], ans: 1, exp: "im(向内) + port(带) ➡️ 进口。" },
  { q: "词根 'scrib / script' 的底层画面是？", opts: ["A. 看", "B. 说", "C. 写", "D. 拉"], ans: 2, exp: "scrib = 写。" },
  { q: "词根 'spect / spic' 代表什么动作？", opts: ["A. 写", "B. 看", "C. 拿", "D. 建"], ans: 1, exp: "spect = 看。" },
  { q: "词根 'tract' 的核心画面是？", opts: ["A. 写", "B. 看", "C. 拉/拖", "D. 转"], ans: 2, exp: "tract = 拉。" },
  { q: "in + spect = ?", opts: ["A. 检查", "B. 尊敬", "C. 描述", "D. 预测"], ans: 0, exp: "in(向内) + spect(看) ➡️ 检查。" },
  { q: "dis + tract = ?", opts: ["A. 吸引", "B. 分心", "C. 提取", "D. 合同"], ans: 1, exp: "dis(分开) + tract(拉) ➡️ 分心。" },
  { q: "pre + scrib + e = ?", opts: ["A. 订阅", "B. 描述", "C. 开处方", "D. 刻写"], ans: 2, exp: "pre(预先) + scrib(写) ➡️ 开处方。" },
  { q: "sub + scrib + e = ?", opts: ["A. 订阅", "B. 描述", "C. 开处方", "D. 刻写"], ans: 0, exp: "sub(在下) + scrib(写) ➡️ 订阅。" },
  { q: "re + spect = ?", opts: ["A. 检查", "B. 尊敬", "C. 描述", "D. 预测"], ans: 1, exp: "re(再次) + spect(看) ➡️ 尊敬。" },
  { q: "ex + tract = ?", opts: ["A. 吸引", "B. 分心", "C. 提取", "D. 合同"], ans: 2, exp: "ex(向外) + tract(拉) ➡️ 提取。" },
  { q: "con + tract = ?", opts: ["A. 吸引", "B. 分心", "C. 提取", "D. 合同/收缩"], ans: 3, exp: "con(共同) + tract(拉) ➡️ 合同。" },
  { q: "de + scrib + e = ?", opts: ["A. 订阅", "B. 描述", "C. 开处方", "D. 刻写"], ans: 1, exp: "de(向下) + scrib(写) ➡️ 描述。" }
];

// ================== 渲染逻辑 ==================
const learnContainer = document.getElementById('learnContainer');
let html = '<h3>🔠 前缀</h3>';
learnData.prefixes.forEach(p => {
  html += `<div class="learn-card"><span class="learn-title">${p.p}</span><span class="learn-en">${p.en}</span><div class="learn-img">🎬 ${p.img}</div><div style="font-size:0.8rem; color:#888;">📜 ${p.origin}</div><div class="learn-ex">📖 ${p.ex}</div></div>`;
});
html += '<h3 style="margin-top:16px;">🌳 词根</h3>';
learnData.roots.forEach((r, idx) => {
  html += `<div class="learn-card"><span class="learn-title">${r.r}</span><span class="learn-en">${r.en}</span><div class="learn-img">🎬 ${r.img}</div><div style="font-size:0.8rem; color:#888;">📜 ${r.origin}</div><button class="family-toggle" onclick="toggleFamily(${idx})">👉 展开家族成员 (${r.family.length})</button><ul class="family-list" id="family-${idx}">`;
  r.family.forEach(f => { html += `<li><span class="fam-word">${f.w}</span><span class="fam-break">${f.b}</span><span>${f.m}</span></li>`; });
  html += `</ul></div>`;
});
learnContainer.innerHTML = html;

function toggleFamily(idx) { document.getElementById(`family-${idx}`).classList.toggle('open'); }

function switchTab(tab) {
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('quizCard').scrollIntoView({ behavior: 'smooth' });
}

let correctCount = 0, answeredCount = 0;
const quizContainer = document.getElementById('quizContainer');
quizData.forEach((q, idx) => {
  let html = `<div class="quiz-card" id="qcard-${idx}"><div class="quiz-question">${idx+1}. ${q.q}</div><div>`;
  q.opts.forEach((opt, oi) => {
    html += `<div class="quiz-opt" onclick="checkAnswer(${idx}, ${oi}, this)">${opt}</div>`;
  });
  html += `</div><div class="quiz-explain" id="exp-${idx}">💡 ${q.exp}</div></div>`;
  quizContainer.innerHTML += html;
});

function checkAnswer(qIdx, oIdx, el) {
  const q = quizData[qIdx];
  const parent = el.parentElement;
  Array.from(parent.children).forEach(c => c.style.pointerEvents = 'none');
  if(oIdx === q.ans) { el.classList.add('correct'); correctCount++; } 
  else { el.classList.add('wrong'); parent.children[q.ans].classList.add('correct'); }
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  answeredCount++;
  document.getElementById('scoreDisplay').innerText = correctCount;
  document.getElementById('progressText').innerText = `进度: ${Math.round((answeredCount/quizData.length)*100)}%`;
  if(answeredCount === quizData.length) document.getElementById('btnFinish').style.display = 'block';
}
</script>
</body>
</html>
