<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Day 1 · 常见前缀与词根</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.88rem;color:#596d7d;line-height:1.65}.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt,button{font:inherit}.opt{padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{display:none;text-align:center;padding:15px}.finish.show{display:block}
</style></head>
<body><main class="wrap"><section class="panel"><h1>Day 1｜常见前缀与词根</h1><p class="note">学习目标：认识 in-/im-、re-、pre-，以及 scrib/script（写）、spect/spic（看）、tract（拉/拖）。词根词缀有助于记忆，但不是每个单词都能靠逐段直译来确定意思；请同时记例词和实际词义。</p>
<div id="study"></div><button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button></section>
<section class="panel" id="quiz"><h2>自测（15题）</h2><div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish">完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div></section></main>
<script>
const units=[['前缀 in- / im-','常见义：not（不）；也可表示 in/into（向内、进入）。在 import 里 im- 是 in- 的拼写变体。','invisible（看不见的）；import（进口）'],['前缀 re-','常见义：again（再次）或 back（向回）。','rewrite（重写）；return（返回）'],['前缀 pre-','常见义：before（在前、预先）。','preview（预览）；preheat（预热）'],['词根 scrib / script','常见义：write（写）。同源词的拼写会变化。','describe（描述）；prescription（处方）；manuscript（手稿）'],['词根 spect / spic','常见义：look / see（看）。','inspect（检查）；spectator（观众）；visible（可见的，相关词根形式不同）'],['词根 tract','常见义：pull / draw（拉、拖）。','attract（吸引）；extract（提取）；contract（合同；收缩）']];
document.getElementById('study').innerHTML=units.map(([a,b,c])=>`<div class="unit"><strong>${a}</strong><div>${b}</div><div class="examples">例词：${c}</div></div>`).join('');
const quiz=[
{q:'前缀 re- 在 rewrite 中最接近哪种意思？',o:['向前','再次','不','在下面'],a:1,e:'rewrite = write again（重写）。'},
{q:'pre- 常表示什么？',o:['在前/预先','向外','共同','错误地'],a:0,e:'如 preview（预览）、preheat（预热）。'},
{q:'invisible 中的 in- 表示什么？',o:['进入','不/无','再次','在前'],a:1,e:'invisible = not visible（看不见的）。in- 也有“进入”义，要看具体单词。'},
{q:'import 中 im- 的含义最接近什么？',o:['不','向外','向内/进入','再次'],a:2,e:'import 是“进口”；im- 是 in- 在 p 前的拼写变体。'},
{q:'scrib / script 常与哪个意思相关？',o:['看','写','拉','说'],a:1,e:'如 describe（描述）、manuscript（手稿）。'},
{q:'inspect 的常见意思是什么？',o:['检查','吸引','返回','处方'],a:0,e:'inspect = examine/look at carefully（检查）。把 in- + spect 当作助记即可。'},
{q:'tract 常与哪个意思相关？',o:['写','看','拉/拖','听'],a:2,e:'如 attract（吸引）、extract（提取）。'},
{q:'extract 的意思是？',o:['分心','提取','尊敬','预览'],a:1,e:'extract 常指取出、提取。词根拆分是记忆线索。'},
{q:'prescription 通常指什么？',o:['处方','观众','合同','回顾'],a:0,e:'prescription = 处方；prescribe 是“开处方”。'},
{q:'manuscript 的意思是？',o:['说明书','手稿','进口商品','检查'],a:1,e:'manuscript 指手稿；manu- 与“手”有关，script 与“写”有关。'},
{q:'spectator 是什么人？',o:['写作者','观众','进口商','医生'],a:1,e:'spectator = 观看比赛或活动的人，即观众。'},
{q:'return 中 re- 最适合联想到什么？',o:['预先','返回','否定','拉'],a:1,e:'return 常表示返回；re- 在词中常有 back 的意思。'},
{q:'attract 常见意思是？',o:['吸引','提取','描述','预热'],a:0,e:'attract = 吸引。词源拆分可辅助记忆，但应优先记词义。'},
{q:'describe 的意思是？',o:['订阅','描述','检查','返回'],a:1,e:'describe = 描述。不要把每个词缀的画面当作现代词义的逐字翻译。'},
{q:'in- / im- 在不同单词中可能表示什么？',o:['只表示“不”','只表示“向内”','可能表示“不”，也可能表示“向内/进入”','只表示“再次”'],a:2,e:'例如 invisible 的 in- 表示“不”，import 的 im- 表示“向内/进入”。'}];
let score=0,done=0;const letters=['A','B','C','D'];const root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<div class="qtitle">${i+1}. ${q.q}</div><div class="options"></div><div class="explain">💡 ${q.e}</div>`;const opts=card.querySelector('.options');q.o.forEach((text,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>{[...opts.children].forEach(x=>x.disabled=true);if(j===q.a){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q.a].classList.add('correct')}card.querySelector('.explain').classList.add('show');done++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').classList.add('show')}};opts.appendChild(b)});root.appendChild(card)});
</script></body></html>
