<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 1 · 基础营</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.9rem;color:#596d7d;line-height:1.65}.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt,.btn{font:inherit}.opt{padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{text-align:center;padding:15px}
</style></head><body><main class="wrap"><section class="panel"><h1>Day 1 · 基础营</h1><p class="note">中学词根大纲：in-/im-（不；向内/进入）、re-（再/回）、pre-（前/预先）；scrib/script（写）、spect/spic（看）、tract（拉/拖）。词根词缀帮助记忆，不代表所有单词都能按部件机械直译。</p><div id="study"></div><button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button></section><section class="panel" id="quiz"><h2>自测（15题）</h2><div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish" hidden>完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div></section></main><script>
const units=[['in- / im-','not / in / into','invisible（看不见的）；import（进口）；impossible（不可能）','否定义与“向内/进入”义需根据具体单词判断。im- 是 in- 在部分辅音前的拼写变体。'],['re-','again / back','rewrite（重写）；return（返回）；review（复习）','常见联想是“再次”或“回到”。'],['pre-','before / ahead','preview（预览）；preheat（预热）；prepare（准备）','常见义是“在前、预先”。'],['scrib / script','write','describe（描述）；prescription（处方）；manuscript（手稿）','来自拉丁语 scribere（写）；词形会有变化。'],['spect / spic','look / see','inspect（检查）；spectator（观众）；respect（尊敬）','来自拉丁语 specere（看）；词根关联是助记线索。'],['tract','pull / draw','attract（吸引）；extract（提取）；contract（合同/收缩）','来自拉丁语 trahere（拉）。']];
document.getElementById('study').innerHTML=units.map(([a,b,c,d])=>`<div class="unit"><strong>${a}</strong> <span>${b}</span><div class="examples">例词：${c}</div><div class="note">${d}</div></div>`).join('');
const quiz=[['re- 在 rewrite 中最接近哪种意思？',['向前','再次','不','在下面'],1,'rewrite = write again（重写）。'],['pre- 常表示什么？',['在前/预先','向外','共同','错误地'],0,'如 preview（预览）、preheat（预热）。'],['invisible 中 in- 表示什么？',['进入','不/无','再次','在前'],1,'invisible = not visible（看不见的）。'],['import 中 im- 的含义最接近什么？',['不','向外','向内/进入','再次'],2,'import 是“进口”；im- 是 in- 的拼写变体。'],['scrib / script 常与哪个意思相关？',['看','写','拉','说'],1,'如 describe（描述）、manuscript（手稿）。'],['inspect 的常见意思是什么？',['检查','吸引','返回','处方'],0,'inspect = 仔细查看、检查。'],['tract 常与哪个意思相关？',['写','看','拉/拖','听'],2,'如 attract（吸引）、extract（提取）。'],['extract 的意思是？',['分心','提取','尊敬','预览'],1,'extract 常指取出、提取。'],['prescription 通常指什么？',['处方','观众','合同','回顾'],0,'prescription = 处方；prescribe = 开处方。'],['manuscript 的意思是？',['说明书','手稿','进口商品','检查'],1,'manuscript 指手稿。'],['spectator 是什么人？',['写作者','观众','进口商','医生'],1,'spectator = 观看者、观众。'],['return 中 re- 最适合联想到什么？',['预先','返回','否定','拉'],1,'return 常表示返回。'],['attract 常见意思是？',['吸引','提取','描述','预热'],0,'attract = 吸引。'],['describe 的意思是？',['订阅','描述','检查','返回'],1,'describe = 描述。'],['in- / im- 在不同单词中可能表示什么？',['只表示“不”','只表示“向内”','可能表示“不”或“向内/进入”','只表示“再次”'],2,'例如 invisible 的 in- 表示“不”，import 的 im- 表示“向内/进入”。']];let score=0,done=0;const letters=['A','B','C','D'],root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<div class="qtitle">${i+1}. ${q[0]}</div><div class="options"></div><div class="explain">💡 ${q[3]}</div>`;const opts=card.querySelector('.options');q[1].forEach((text,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>{if(b.disabled)return;[...opts.children].forEach(x=>x.disabled=true);if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q[2]].classList.add('correct')}card.querySelector('.explain').classList.add('show');done++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').hidden=false}};opts.appendChild(b)});root.appendChild(card)});
</script></body></html>
