<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Day 16 · 光与物理 (含错题本)</title>
  <style>
    /* 标准样式复用 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f5fb; padding: 14px 10px 30px; color: #1a2a3a; }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.4rem; color: #0b2b4a; border-left: 6px solid #2a7faa; padding-left: 14px; margin-bottom: 14px; }
    
    .progress-bar { display: flex; justify-content: space-between; background: white; padding: 10px 16px; border-radius: 40px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e0eaf2; }
    .step { font-size: 0.85rem; font-weight: 600; color: #a0b5c8; }
    .step.active { color: #1f5880; }
    .step.done { color: #1a7a3a; }

    .page { display: none; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 6px 18px rgba(0, 20, 30, 0.08); border: 1px solid #e6eef6; }
    .page.active { display: block; }
    h2 { font-size: 1.2rem; color: #134b6b; margin-bottom: 14px; border-bottom: 2px solid #e3edf5; padding-bottom: 8px; }
    
    .learn-card { background: #fafdff; border: 1px solid #e3ecf5; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .learn-title { font-size: 1.15rem; font-weight: 700; color: #b13e2e; }
    .learn-en { font-size: 0.85rem; color: #1f5880; font-weight: 600; background: #e3edf5; display: inline-block; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
    .learn-img { font-size: 0.9rem; color: #5c4328; margin: 8px 0; background: #fdfaf2; padding: 8px 10px; border-radius: 8px; border-left: 3px solid #d48c5c; }
    .learn-origin { font-size: 0.82rem; color: #6d8aa3; font-style: italic; margin-top: 6px; padding-left: 4px; }
    
    .family-toggle { display: block; width: 100%; background: #e3edf5; border: none; padding: 8px; border-radius: 8px; font-size: 0.85rem; color: #1f5880; font-weight: 600; cursor: pointer; margin-top: 10px; text-align: center; }
    .family-list { display: none; list-style: none; padding: 0; margin-top: 10px; border-top: 1px dashed #d0dfec; padding-top: 10px; }
    .family-list.open { display: block; }
    .family-list li { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 6px 0; border-bottom: 1px dotted #e0eaf2; }
    .fam-word { font-weight: 600; color: #b13e2e; width: 120px; }
    .fam-break { color: #666; flex: 1; font-size: 0.82rem; margin-left: 8px; }
    .fam-mean { color: #1a4d6b; text-align: right; font-size: 0.85rem; width: 90px; }

    .btn { background: #1f5880; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; transition: 0.2s; }
    .btn:hover { background: #13466a; }
    .btn-next { background: #1a7a3a; }
    .btn-wrong { background: #b13e2e; }
    
    .quiz-card { background: #f8fbff; border: 1px solid #d5e4f1; border-radius: 16px; padding: 16px; margin-bottom: 14px; transition: 0.3s; }
    .quiz-question { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; line-height: 1.5; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt { background: white; border: 1px solid #c9dae8; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
    .quiz-opt:hover { background: #e6f0f8; }
    .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: 700; }
    .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; font-weight: 700; }
    .quiz-explain { display: none; margin-top: 10px; font-size: 0.85rem; color: #1a4d6b; background: #e3edf5; padding: 8px 12px; border-radius: 8px; }
    .quiz-explain.show { display: block; }
    
    .feedback-ok { box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); border-color: #28a745; }
    .feedback-no { box-shadow: 0 0 10px rgba(220, 53, 69, 0.4); border-color: #dc3545; }

    .finish-msg { text-align: center; padding: 30px 10px; display: none; }
    .finish-msg.show { display: block; }
    .finish-msg h3 { color: #1a7a3a; font-size: 1.3rem; margin-bottom: 10px; }
    .score-board { background: #e3edf5; padding: 8px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; color: #1f5880; margin-bottom: 16px; display: flex; justify-content: space-between; }

    .wrong-book { display: none; background: #fff5f5; border: 1px solid #f5c6cb; border-radius: 16px; padding: 16px; margin-top: 20px; }
    .wrong-book.show { display: block; }
    .wrong-book h3 { color: #b13e2e; font-size: 1.1rem; margin-bottom: 10px; }
    .wrong-item { background: white; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; border-left: 3px solid #dc3545; font-size: 0.9rem; }
    .wrong-item .q-text { font-weight: 600; margin-bottom: 4px; }
    .wrong-item .a-text { color: #1a7a3a; font-weight: 600; }
    .wrong-item .e-text { color: #6d8aa3; font-size: 0.82rem; margin-top: 4px; }
  </style>
</head>
<body>
<div class="container">
  
  <div class="progress-bar" id="progressBar">
    <span class="step active" id="step-0">1. 认零件</span>
    <span class="step" id="step-1">2. 刷题库</span>
    <span class="step" id="step-2">🏆 通关</span>
  </div>

  <div class="page active" id="page-0">
    <h2>Day 16：光与物理</h2>
    <p style="font-size:0.85rem; color:#666; margin-bottom:12px;">今天掌握：光 (photo/lumin) + 热 (therm) + 自然 (phys)。<br><span style="color:#b13e2e;">⚠️ 做错的题目会自动进错题本。</span></p>
    <div id="learnContainer"></div>
    <button class="btn btn-next" onclick="goToPage(1)">✅ 学完了，去刷题</button>
  </div>

  <div class="page" id="page-1">
    <h2>题海演练：15题挑战</h2>
    <div class="score-board">
      <span>📊 已答对: <strong id="scoreDisplay">0</strong> / 15</span>
      <span id="progressText">进度: 0%</span>
    </div>
    <div id="quizContainer"></div>
    
    <div class="wrong-book" id="wrongBook">
      <h3>📕 我的错题本</h3>
      <div id="wrongList"></div>
      <button class="btn btn-wrong" onclick="retryWrong()">🔄 重练错题</button>
    </div>
    <button class="btn btn-wrong" id="showWrongBtn" onclick="showWrongBook()" style="display:none;">📕 查看错题本</button>
    <button class="btn" id="btn-finish" onclick="goToPage(2)" style="display:none; background:#1a7a3a; margin-top:12px;">🏆 完成 Day 16</button>
  </div>

  <div class="page" id="page-2">
    <div class="finish-msg show" style="display:block;">
      <h3>🎉 Day 16 通关！</h3>
      <p style="color:#555; margin:10px 0; font-size:1.1rem;">光与物理词根，完美掌握！</p>
      <button class="btn" onclick="location.reload()">🔄 再刷一次</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// Day 16 数据区
// ==========================================
const learnData = {
  prefixes: [
    { p: "photo-", en: "light", img: "画面是一束强光照下来，把东西照亮。", origin: "源自希腊语 phōs/phōtos (光)。", ex: "photograph (照片), photosynthesis (光合作用)" }
  ],
  roots: [
    { r: "lumin / luc", en: "light / shine", img: "画面是一个灯泡或者月亮在发出柔和的光。", origin: "源自拉丁语 lumen (光) 或 lucere (发光)。", family: [{ w: "illuminate", b: "il(使) + lumin(光) + ate", m: "v. 照亮 / 阐明" },{ w: "lucid", b: "luc(光) + id(形)", m: "adj. 清晰的 / 透明的" }] },
    { r: "therm", en: "heat", img: "画面是温度计里的水银柱因为受热而上升。", origin: "源自希腊语 thermē (热)。", family: [{ w: "thermometer", b: "therm(热) + meter(测量)", m: "n. 温度计" },{ w: "thermal", b: "therm(热) + al(形)", m: "adj. 热的 / 保暖的" }] },
    { r: "phys", en: "nature / physical", img: "画面是大自然中的山川河流，以及人体的构造。", origin: "源自希腊语 physis (自然)。", family: [{ w: "physics", b: "phys(自然) + ics(学科)", m: "n. 物理学" },{ w: "physical", b: "phys(自然) + ical(形)", m: "adj. 身体的 / 物质的" },{ w: "physician", b: "phys(自然) + ician(人)", m: "n. 内科医生" }] }
  ]
};

const quizData = [
  // --- 新知识 8题 ---
  { q: "前缀 'photo-' 的含义是？", opts: ["A. 光", "B. 热", "C. 自然", "D. 声音"], ans: 0, exp: "photo- = 光。photograph(照片)。" },
  { q: "词根 'lumin / luc' 的画面是？", opts: ["A. 光/发光", "B. 热", "C. 自然", "D. 写"], ans: 0, exp: "lumin/luc = 光。illuminate(照亮)。" },
  { q: "词根 'therm' 代表什么？", opts: ["A. 热", "B. 光", "C. 自然", "D. 看"], ans: 0, exp: "therm = 热。thermometer(温度计)。" },
  { q: "词根 'phys' 的核心含义是？", opts: ["A. 自然/物理", "B. 光", "C. 热", "D. 声音"], ans: 0, exp: "phys = 自然。physics(物理学)。" },
  { q: "单词 'illuminate' (il + lumin + ate) 的字面画面是？", opts: ["A. 使有光 ➡️ 照亮", "B. 使有热 ➡️ 加热", "C. 使自然 ➡️ 自然化", "D. 使声音 ➡️ 发声"], ans: 0, exp: "il(使) + lumin(光) ➡️ 照亮。" },
  { q: "单词 'thermometer' (therm + meter) 的字面画面是？", opts: ["A. 测量热度 ➡️ 温度计", "B. 测量长度 ➡️ 尺子", "C. 测量光线 ➡️ 光度计", "D. 测量声音 ➡️ 声呐"], ans: 0, exp: "therm(热) + meter(测量) ➡️ 温度计。" },
  { q: "单词 'physical' (phys + ical) 的意思是？", opts: ["A. 身体的 / 物质的", "B. 心理的", "C. 化学的", "D. 生物的"], ans: 0, exp: "phys(自然) + ical(形) ➡️ 身体的/物质的。" },
  { q: "单词 'lucid' (luc + id) 的字面画面是？", opts: ["A. 充满光的 ➡️ 清晰的", "B. 充满热的 ➡️ 温暖的", "C. 自然的 ➡️ 天然的", "D. 黑暗的 ➡️ 模糊的"], ans: 0, exp: "luc(光) + id ➡️ 清晰的。" },

  // --- 滚动复习 7题 ---
  { q: "【复习】词根 'simil' 代表什么？", opts: ["A. 相似", "B. 相等", "C. 测量", "D. 多"], ans: 0, exp: "simil = 相似。similar(相似的)。(Day 15)" },
  { q: "【复习】单词 'equator' 中的词根是？", opts: ["A. equ (相等)", "B. simil (相似)", "C. meter (测量)", "D. multi (多)"], ans: 0, exp: "equ = 相等。equator(赤道)。(Day 15)" },
  { q: "【复习】词根 'meter' 代表什么动作？", opts: ["A. 测量", "B. 相等", "C. 相似", "D. 多"], ans: 0, exp: "meter = 测量。(Day 15)" },
  { q: "【复习】单词 'multiply' 中的词根是？", opts: ["A. multi (多)", "B. meter (测量)", "C. equ (相等)", "D. simil (相似)"], ans: 0, exp: "multi = 多。(Day 15)" },
  { q: "【复习】词根 'man' 代表什么？", opts: ["A. 手/处理", "B. 命令", "C. 爱", "D. 光"], ans: 0, exp: "man = 手/处理。(Day 14)" },
  { q: "【复习】词根 'mand' 的画面是？", opts: ["A. 命令", "B. 手", "C. 爱", "D. 光"], ans: 0, exp: "mand = 命令。(Day 14)" },
  { q: "【复习】前缀 'en-' 的含义是？", opts: ["A. 使...进入状态", "B. 向外", "C. 在下面", "D. 反对"], ans: 0, exp: "en- = 使...。(Day 14)" }
];

// ==========================================
// 渲染与错题本逻辑 (标准模板)
// ==========================================
const learnContainer = document.getElementById('learnContainer');
let learnHtml = '<h3 style="font-size:1rem; color:#1f5880; margin-bottom:8px;">🔠 前缀零件</h3>';
learnData.prefixes.forEach(p => {
  learnHtml += `<div class="learn-card"><span class="learn-title">${p.p}</span><span class="learn-en">${p.en}</span><div class="learn-img">🎬 ${p.img}</div><div class="learn-origin">📜 词源：${p.origin}</div><div class="learn-ex">📖 例：${p.ex}</div></div>`;
});
learnHtml += '<h3 style="font-size:1rem; color:#1f5880; margin:16px 0 8px;">🌳 词根引擎</h3>';
learnData.roots.forEach((r, idx) => {
  learnHtml += `<div class="learn-card"><span class="learn-title">${r.r}</span><span class="learn-en">${r.en}</span><div class="learn-img">🎬 ${r.img}</div><div class="learn-origin">📜 词源：${r.origin}</div><button class="family-toggle" onclick="toggleFamily(${idx})">👉 展开家族成员 (${r.family.length})</button><ul class="family-list" id="family-${idx}">`;
  r.family.forEach(f => { learnHtml += `<li><span class="fam-word">${f.w}</span><span class="fam-break">${f.b}</span><span class="fam-mean">${f.m}</span></li>`; });
  learnHtml += `</ul></div>`;
});
learnContainer.innerHTML = learnHtml;

function toggleFamily(idx) { document.getElementById(`family-${idx}`).classList.toggle('open'); }

let wrongAnswers = []; 
let retrying = false;
let retryIndices = [];
let correctCount = 0;
let answeredCount = 0;

const quizContainer = document.getElementById('quizContainer');

function renderQuiz(indices) {
  quizContainer.innerHTML = '';
  indices.forEach((realIdx, displayIdx) => {
    const q = quizData[realIdx];
    let html = `<div class="quiz-card" id="qcard-${displayIdx}"><div class="quiz-question">${displayIdx+1}. ${q.q}</div><div class="quiz-options">`;
    q.opts.forEach((opt, oi) => {
      html += `<div class="quiz-opt" onclick="checkAnswer(${realIdx}, ${oi}, this, ${displayIdx})">${opt}</div>`;
    });
    html += `</div><div class="quiz-explain" id="exp-${displayIdx}">💡 ${q.exp}</div></div>`;
    quizContainer.innerHTML += html;
  });
}

function initQuiz() {
  wrongAnswers = [];
  retrying = false;
  correctCount = 0;
  answeredCount = 0;
  const indices = quizData.map((_, i) => i);
  renderQuiz(indices);
  document.getElementById('scoreDisplay').innerText = '0';
  document.getElementById('progressText').innerText = '进度: 0%';
  document.getElementById('wrongBook').classList.remove('show');
  document.getElementById('showWrongBtn').style.display = 'none';
  document.getElementById('btn-finish').style.display = 'none';
}

function checkAnswer(realIdx, oIdx, el, displayIdx) {
  const q = quizData[realIdx];
  const parent = el.parentElement;
  const card = document.getElementById(`qcard-${displayIdx}`);
  Array.from(parent.children).forEach(c => c.style.pointerEvents = 'none');
  
  if(oIdx === q.ans) {
    el.classList.add('correct');
    card.classList.add('feedback-ok');
    correctCount++;
  } else {
    el.classList.add('wrong');
    parent.children[q.ans].classList.add('correct');
    card.classList.add('feedback-no');
    if(!wrongAnswers.find(w => w.idx === realIdx)) {
      wrongAnswers.push({ idx: realIdx, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
    }
  }
  
  document.getElementById(`exp-${displayIdx}`).classList.add('show');
  answeredCount++;
  document.getElementById('scoreDisplay').innerText = correctCount;
  
  const total = retrying ? retryIndices.length : quizData.length;
  document.getElementById('progressText').innerText = `进度: ${Math.round((answeredCount/total)*100)}%`;
  
  if(answeredCount === total) {
    document.getElementById('showWrongBtn').style.display = 'block';
    if(retrying) {
      document.getElementById('btn-finish').style.display = 'block';
    }
    if(wrongAnswers.length === 0) {
      document.getElementById('showWrongBtn').innerText = '🎉 全对！没有错题';
      document.getElementById('showWrongBtn').style.background = '#1a7a3a';
    } else {
      document.getElementById('showWrongBtn').innerText = `📕 查看错题本 (${wrongAnswers.length}题)`;
      document.getElementById('showWrongBtn').style.background = '#b13e2e';
    }
  }
}

function showWrongBook() {
  const book = document.getElementById('wrongBook');
  const list = document.getElementById('wrongList');
  list.innerHTML = '';
  if(wrongAnswers.length === 0) {
    list.innerHTML = '<p style="color:#1a7a3a; font-weight:600;">🎉 恭喜你，没有错题！</p>';
  } else {
    wrongAnswers.forEach(w => {
      const correctLetter = String.fromCharCode(65 + w.ans);
      list.innerHTML += `<div class="wrong-item">
        <div class="q-text">${w.q}</div>
        <div class="a-text">✅ 正确答案：${correctLetter}. ${w.opts[w.ans].replace(/^[A-D]\.\s*/, '')}</div>
        <div class="e-text">💡 ${w.exp}</div>
      </div>`;
    });
  }
  book.classList.add('show');
}

function retryWrong() {
  if(wrongAnswers.length === 0) return;
  retrying = true;
  retryIndices = wrongAnswers.map(w => w.idx);
  wrongAnswers = [];
  correctCount = 0;
  answeredCount = 0;
  
  document.getElementById('wrongBook').classList.remove('show');
  document.getElementById('showWrongBtn').style.display = 'none';
  document.getElementById('btn-finish').style.display = 'none';
  document.getElementById('scoreDisplay').innerText = '0';
  document.getElementById('progressText').innerText = '进度: 0%';
  
  renderQuiz(retryIndices);
}

function goToPage(pageIdx) {
  document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i === pageIdx));
  document.querySelectorAll('.step').forEach((s, i) => {
    s.classList.remove('active', 'done');
    if(i < pageIdx) s.classList.add('done');
    if(i === pageIdx) s.classList.add('active');
  });
  window.scrollTo(0, 0);
}

// 初始化
initQuiz();
</script>
</body>
</html>
