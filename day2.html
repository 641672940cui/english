<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 · 方向与动作</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.9rem;color:#596d7d;line-height:1.65}.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt,.btn{font:inherit}.opt{padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem;line-height:1.5}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{text-align:center;padding:15px}
</style>
</head>
<body>
<main class="wrap">
<section class="panel">
<h1>Day 2 · 方向与动作</h1>
<p class="note">中学词根大纲：pro-（向前）；sub-（在下方/次级）；trans-（跨越/转移）；dict（说）；duc/duct（引导）；port（携带/运送）。词缀和词根提供记忆线索；整词词义应结合实际用法学习，避免机械拆译。</p>
<div id="study"></div>
<button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button>
</section>
<section class="panel" id="quiz">
<h2>自测（15题）</h2>
<div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div>
<div id="questions"></div>
<div class="finish" id="finish" hidden>完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div>
</section>
</main>
<script>
const units=[
['pro-','forward / before','progress（进步）；promote（提升/促进）；project（项目）','常见联想是向前推进；要结合各词的实际意思。'],
['sub-','under / below','subway（地铁）；submarine（潜水艇）；subject（主题/主语）','常见义有在下方、次级；不同单词意义不完全相同。'],
['trans-','across / through','transport（运输）；translate（翻译）；transfer（转移）','常见联想是跨越、从一处到另一处。'],
['dict','say / speak','predict（预测）；contradict（反驳）；dictionary（字典）','与说、讲相关。'],
['duc / duct','lead / bring','conduct（引导/指挥）；introduce（介绍）；produce（生产）','与引导、带领相关。'],
['port','carry / bring','import（进口）；export（出口）；support（支持）','与携带、运送相关；support 应按整体词义记为支持/支撑。']
];
document.getElementById('study').innerHTML=units.map(([a,b,c,d])=>`<div class="unit"><strong>${a}</strong> <span>${b}</span><div class="examples">例词：${c}</div><div class="note">${d}</div></div>`).join('');
const quiz=[
['pro- 最常见的方向联想是？',['向前/向前推进','向后','在下面','跨越'],0,'如 progress（进步）、promote（促进）。'],
['sub- 常见的空间意思是什么？',['在两者之间','向外','在下方','再次'],2,'如 subway、submarine。'],
['trans- 常见的意思是什么？',['否定','跨越/从一处到另一处','向前','同伴'],1,'如 transport、transfer。'],
['词根 dict 常与什么意思有关？',['写','携带','建造','说/讲'],3,'如 predict、dictionary。'],
['词根 duc / duct 常与什么意思有关？',['看','压','引导/带领','写'],2,'如 conduct、introduce。'],
['port 在 import、export 等词中常与什么意思有关？',['说','携带/运输','判断','转动'],1,'port 常与携带、运输有关。'],
['predict 的常见意思是什么？',['反驳','减少','预测','生产'],2,'predict = 预测。'],
['contradict 的常见意思是什么？',['反驳/与……矛盾','引导','携带','翻译'],0,'contradict = 反驳、与……矛盾。'],
['conduct 在 “She conducted the meeting” 中是什么意思？',['预测','进口','地下','主持/引导'],3,'conduct 可表示主持、指挥或引导。'],
['introduce 的常见意思是什么？',['减少','介绍/引入','预测','反对'],1,'introduce = 介绍、引入。'],
['export 的意思是什么？',['出口','进口','支持','潜水艇'],0,'export = 出口。'],
['transport 的意思是什么？',['反驳','支持','运输、运送','减少'],2,'transport = 运输、运送。'],
['support 的常见意思是哪一项？',['预测','支持/支撑','翻译','反驳'],1,'support = 支持、支撑；不要机械拆译。'],
['education 最适合怎么学习？',['由 e+duc 简单直译','表示进口','记整体词义“教育/培养”，拆分只作联想','表示反驳'],2,'education 与拉丁语 educare（养育、培养）有关，不宜将现代词义简化为部件直译。'],
['submarine 中 sub- 的意思最接近什么？',['向前','在两者之间','向外','在下方'],3,'submarine = 潜水艇。']
];
let score=0,done=0;
const letters=['A','B','C','D'],root=document.getElementById('questions');
quiz.forEach((q,i)=>{
 const card=document.createElement('div');card.className='question';
 card.innerHTML=`<div class="qtitle">${i+1}. ${q[0]}</div><div class="options"></div><div class="explain">💡 ${q[3]}</div>`;
 const opts=card.querySelector('.options');
 q[1].forEach((text,j)=>{
  const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;
  b.onclick=()=>{
   if(b.disabled)return;
   [...opts.children].forEach(x=>x.disabled=true);
   if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q[2]].classList.add('correct')}
   card.querySelector('.explain').classList.add('show');done++;
   document.getElementById('score').textContent=score;
   document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;
   if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').hidden=false}
  };
  opts.appendChild(b);
 });
 root.appendChild(card);
});
</script>
</body></html>
