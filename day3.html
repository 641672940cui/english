<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 3 · 数量与建造</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e4edf5;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 16px #0014220d}h1,h2{color:#134b6b;margin:0 0 12px}.note{color:#62788a;font-size:.9rem;line-height:1.6}.unit,.question{background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;padding:13px;margin:10px 0}.unit strong{color:#b13e2e;font-size:1.08rem}.en{color:#1f5880;margin-left:8px}.examples{line-height:1.65;margin-top:6px;color:#425d72}.score{display:flex;justify-content:space-between;background:#e3edf5;border-radius:9px;padding:10px;margin-bottom:12px;font-weight:600}.qtitle{font-weight:650;line-height:1.5;margin-bottom:9px}.options{display:grid;gap:7px}.option{font:inherit;text-align:left;background:#fff;border:1px solid #c9dae8;padding:10px 12px;border-radius:9px;cursor:pointer}.option:hover:not(:disabled){background:#e6f0f8}.option:disabled{cursor:default}.option.correct{background:#d4edda;border-color:#28a745}.option.wrong{background:#f8d7da;border-color:#dc3545}.explanation{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;line-height:1.5}.explanation.show{display:block}.btn{width:100%;border:0;border-radius:24px;padding:12px;background:#1f5880;color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}.btn.green{background:#1a7a3a}.finish{display:none;text-align:center;padding:16px}.finish.show{display:block}.final{font-size:1.4rem;color:#1a7a3a;font-weight:700}
</style></head><body><main class="wrap">
<section class="panel"><h1>Day 3 · 数量与建造</h1><p class="note">学习 co-/con-（共同）、over-（在上方/过度）、under-（在下方/不足）以及 struct（建造）、form（形状）。词缀含义随具体单词和语境变化，拆分只作为记忆线索。</p><div id="study"></div><button class="btn green" onclick="document.getElementById('practice').scrollIntoView({behavior:'smooth'})">开始练习</button></section>
<section class="panel" id="practice"><h2>自测（10题）</h2><div class="score"><span>答对：<b id="score">0</b> / 10</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish">完成！得分：<span class="final" id="finalScore"></span> / 10<button class="btn" onclick="location.reload()">再练一次</button></div></section>
</main><script>
const units=[['co- / con-','together / with','cooperate（合作）；connect（连接）；combine（结合）','常见联想是共同、一起；具体词义以整词为准。'],['over-','above / too much','overhead（头顶上方）；overwork（工作过度）；overcome（克服）','可表示在上方或超过、过度，按语境理解。'],['under-','below / insufficient','underground（地下的）；underestimate（低估）','常见联想是在下方、不足；并非每个词都能机械拆译。'],['struct','build','structure（结构）；construct（建造）','与建造、构筑相关。'],['form','shape','formation（形成）；reform（改革）','与形状、形成有关；记忆时结合整词。']];
document.getElementById('study').innerHTML=units.map(u=>`<div class="unit"><strong>${u[0]}</strong><span class="en">${u[1]}</span><div class="examples">例词：${u[2]}</div><div class="note">${u[3]}</div></div>`).join('');
const quiz=[['co- / con- 常见的含义是什么？',['共同、一起','在下方','错误地','再次'],0,'如 cooperate（合作）、connect（连接）。'],['overwork 中 over- 最接近什么含义？',['在下方','过度','共同','转动'],1,'overwork 是工作过度。'],['underground 的意思是什么？',['地面上方','工作过度','地下的','共同建造'],2,'under- 在此表示在下方。'],['struct 常与什么含义有关？',['说','看','携带','建造'],3,'如 structure（结构）、construct（建造）。'],['form 常与什么概念有关？',['形状、形成','压、挤压','跟随','反对'],0,'如 formation（形成）。'],['connect 的常见意思是什么？',['低估','连接','改革','超过'],1,'connect = 连接；con- 有共同、一起的联想。'],['underestimate 的意思是什么？',['高估','重建','低估','连接'],2,'underestimate = 低估。'],['construct 的常见意思是什么？',['破坏','转动','预测','建造'],3,'construct = 建造。'],['以下哪项对 over- 的说明较准确？',['可表示在上方或过度，需看语境','永远表示共同','只表示否定','表示听见'],0,'前缀的具体作用要结合词义和语境。'],['词根词缀最适合如何使用？',['逐字硬翻所有单词','作为理解和记忆线索，并核对整词词义','忽略语境','只看拼写猜词义'],1,'构词知识能辅助学习，但不能替代词典义和语境。']];
let score=0,answered=0;const letters=['A','B','C','D'],root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('article');card.className='question';const title=document.createElement('div');title.className='qtitle';title.textContent=`${i+1}. ${q[0]}`;const opts=document.createElement('div');opts.className='options';q[1].forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>answer(i,j,b);opts.appendChild(b)});const exp=document.createElement('div');exp.className='explanation';exp.textContent='💡 '+q[3];card.append(title,opts,exp);root.appendChild(card)});function answer(i,j,b){const q=quiz[i],card=b.closest('.question'),opts=[...card.querySelectorAll('.option')];if(opts.some(x=>x.disabled))return;opts.forEach(x=>x.disabled=true);if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');opts[q[2]].classList.add('correct')}card.querySelector('.explanation').classList.add('show');answered++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(answered/quiz.length*100)}%`;if(answered===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').classList.add('show')}}
</script></body></html>
