<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Day 3 · 数量与建造</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.88rem;color:#596d7d;line-height:1.65}.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt{font:inherit;padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{display:none;text-align:center;padding:15px}.finish.show{display:block}
</style></head><body><main class="wrap"><section class="panel"><h1>Day 3｜常见前缀与词根</h1><p class="note">学习目标：认识 co-/con-、over-、under-，以及 struct（建造）、form（形状/形成）、fact/fect（做、制造）。词缀和词根提供记忆线索，不保证每个词都能按部件直译。</p><div id="study"></div><button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button></section><section class="panel" id="quiz"><h2>自测（15题）</h2><div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish">完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div></section></main>
<script>
const units=[['前缀 co- / con-','常见义：共同、一起；在一些词中会因拼写环境变化。','cooperate（合作）；connect（连接）'],['前缀 over-','可表示在上方、越过；也可表示过度。','overcome（克服）；overwork（过度工作）'],['前缀 under-','可表示在下方；也常表示不足、低于标准。','underground（地下）；underestimate（低估）'],['词根 struct','与建造、堆砌有关。','construct（建造）；structure（结构）；instruct（指导）'],['词根 form','与形状、形成有关。','transform（改变形态）；reform（改革）；inform（告知）'],['词根 fact / fect','与做、制造有关；词形会随单词变化。','factory（工厂）；effect（效果）；manufacture（制造）']];
document.getElementById('study').innerHTML=units.map(([a,b,c])=>`<div class="unit"><strong>${a}</strong><div>${b}</div><div class="examples">例词：${c}</div></div>`).join('');
const quiz=[
{q:'co- / con- 常表示什么？',o:['向后','共同/一起','在下方','跨越'],a:1,e:'如 cooperate（合作）、connect（连接）。'},
{q:'over- 在 overwork 中表达什么？',o:['不足','在下面','过度','共同'],a:2,e:'overwork = 工作过度。over- 也可表示在上方或越过。'},
{q:'underestimate 的意思是？',o:['高估','低估','建造','重做'],a:1,e:'under- 有低于、不足的意思；underestimate = 低估。'},
{q:'词根 struct 常与什么意思有关？',o:['建造/堆砌','说','携带','转动'],a:0,e:'如 construct（建造）、structure（结构）。'},
{q:'form 常与什么概念有关？',o:['声音','形状/形成','判断','拉'],a:1,e:'如 transform（改变形态）、reform（改革）。'},
{q:'fact / fect 常与什么意思有关？',o:['做/制造','写','看','跟随'],a:0,e:'如 factory（工厂）、effect（效果）。'},
{q:'overcome 的常见意思是？',o:['克服','低估','连接','制造'],a:0,e:'overcome = 克服。over- 有越过的联想，但不是所有词都能直译。'},
{q:'construct 的意思是？',o:['反驳','建造','告知','感染'],a:1,e:'construct = 建造、构筑。'},
{q:'structure 通常指什么？',o:['结构','结果','合同','声音'],a:0,e:'structure = 结构、构造。'},
{q:'transform 的意思是？',o:['支持','改变/转换','估计','压缩'],a:1,e:'transform = 使改变形态、转换。'},
{q:'inform 最常见的意思是？',o:['通知/告知','破坏','过度工作','建造'],a:0,e:'inform = 通知、告知。不要把 in + form 的记忆图像当成严格直译。'},
{q:'effect 通常指什么？',o:['事实','效果/影响','工厂','结构'],a:1,e:'effect 常作名词，表示效果、影响。'},
{q:'manufacture 的意思是？',o:['制造','估计','改革','阻挡'],a:0,e:'manufacture = 制造。manu-、fact- 的联想可辅助记忆。'},
{q:'under- 在 underground 中表示什么？',o:['在上方','在下面','再次','共同'],a:1,e:'underground = 地下的/地下空间。'},
{q:'哪个词表示“低估”？',o:['overcome','underestimate','transform','construct'],a:1,e:'underestimate = 低估。'}];
let score=0,done=0;const letters=['A','B','C','D'];const root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<div class="qtitle">${i+1}. ${q.q}</div><div class="options"></div><div class="explain">💡 ${q.e}</div>`;const opts=card.querySelector('.options');q.o.forEach((text,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>{[...opts.children].forEach(x=>x.disabled=true);if(j===q.a){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q.a].classList.add('correct')}card.querySelector('.explain').classList.add('show');done++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').classList.add('show')}};opts.appendChild(b)});root.appendChild(card)});
</script></body></html>
