<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 3 · 数量与建造</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.9rem;color:#596d7d;line-height:1.65}.outline,.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.outline strong,.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt,.btn{font:inherit}.opt{padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{text-align:center;padding:15px}</style></head><body><main class="wrap"><section class="panel"><h1>Day 3 · 数量与建造</h1><p class="note">中学词根大纲：co-/con-（共同/一起）、over-（在上方/过度）、under-（在下方/不足）；struct（建造）、form（形状/形成）、fact/fect（做/制造）。重点掌握常见词义，不把构词成分机械拼成整词释义。</p><div id="study"></div><button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button></section><section class="panel" id="quiz"><h2>自测（15题）</h2><div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish" hidden>完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div></section></main><script>
const units=[['co-/con-','with / together','cooperate（合作）；connect（连接）；combine（联合）','常见义是共同、一起。'],['over-','above / excessive','overcome（克服）；overwork（过度工作）；overlook（俯瞰/忽略）','可表示在上方、越过，也可表示过度。'],['under-','below / insufficient','underestimate（低估）；underground（地下）；understand（理解）','可表示在下方或不足；understand 应按整体词义记。'],['struct','build / construct','construct（建造）；structure（结构）；instruction（指导说明）','与建造、堆砌相关。'],['form','shape / form','transform（转变）；reform（改革）；inform（通知）','与形状、形成相关，但 inform 要按“通知/告知”记。'],['fact / fect','make / do','factory（工厂）；effect（效果）；manufacture（制造）','与做、制造有关；词形和词义会随单词变化。']];document.getElementById('study').innerHTML=units.map(([a,b,c,d])=>`<div class="unit"><strong>${a}</strong> <span>${b}</span><div class="examples">例词：${c}</div><div class="note">${d}</div></div>`).join('');
const quiz=[['co- / con- 常表示什么？',['向后','共同/一起','在下方','跨越'],1,'如 cooperate（合作）、connect（连接）。'],['over- 在 overwork 中表达什么？',['不足','在下面','过度','共同'],2,'overwork = 工作过度。'],['underestimate 的意思是？',['高估','低估','建造','重做'],1,'underestimate = 低估。'],['词根 struct 常与什么意思有关？',['建造/堆砌','说','携带','转动'],0,'如 construct、structure。'],['form 常与什么概念有关？',['声音','形状/形成','判断','拉'],1,'如 transform、reform。'],['fact / fect 常与什么意思有关？',['做/制造','写','看','跟随'],0,'如 factory、effect。'],['overcome 的常见意思是？',['克服','低估','连接','制造'],0,'overcome = 克服。'],['construct 的意思是？',['反驳','建造','告知','感染'],1,'construct = 建造、构筑。'],['structure 通常指什么？',['结构','结果','合同','声音'],0,'structure = 结构。'],['transform 的意思是？',['支持','改变/转换','估计','压缩'],1,'transform = 改变形态、转换。'],['inform 最常见的意思是？',['通知/告知','破坏','过度工作','建造'],0,'inform = 通知、告知。'],['effect 通常指什么？',['事实','效果/影响','工厂','结构'],1,'effect = 效果、影响。'],['manufacture 的意思是？',['制造','估计','改革','阻挡'],0,'manufacture = 制造。'],['under- 在 underground 中表示什么？',['在上方','在下面','再次','共同'],1,'underground = 地下。'],['以下哪一项是“低估”？',['overcome','underestimate','transform','construct'],1,'underestimate = 低估。']];let score=0,done=0;const letters=['A','B','C','D'],root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<div class="qtitle">${i+1}. ${q[0]}</div><div class="options"></div><div class="explain">💡 ${q[3]}</div>`;const opts=card.querySelector('.options');q[1].forEach((text,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>{if(b.disabled)return;[...opts.children].forEach(x=>x.disabled=true);if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q[2]].classList.add('correct')}card.querySelector('.explain').classList.add('show');done++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').hidden=false}};opts.appendChild(b)});root.appendChild(card)});
</script></body></html>
