<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 4 · 否定拓展与转换</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.9rem;color:#596d7d;line-height:1.65}.outline,.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.outline strong,.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt,.btn{font:inherit}.opt{padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{text-align:center;padding:15px}</style></head><body><main class="wrap"><section class="panel"><h1>Day 4 · 否定拓展与转换</h1><p class="note">中学词根大纲：dis-（不/分开）、mis-（错误地）、anti-（反对/对抗）；vert/vers（转）、sequ（跟随）。词根拆分是记忆工具，具体词义应结合整词和语境。</p><div id="study"></div><button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button></section><section class="panel" id="quiz"><h2>自测（15题）</h2><div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish" hidden>完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div></section></main><script>
const units=[['dis-','not / apart','disagree（不同意）；disappear（消失）；disconnect（断开）','常见联想：不、分开、取消；需看具体单词。'],['mis-','wrongly / badly','misunderstand（误解）；misplace（放错）；misread（误读）','常见义是错误地、不当地。'],['anti-','against / opposite','antiwar（反战）；antibiotic（抗生素）；antisocial（反社会的）','常见义是反对、对抗；antibiotic 应按医学词汇整体记。'],['vert / vers','turn','reverse（反转）；convert（转换）；version（版本）','与转动、转向相关。'],['sequ / secut','follow','sequence（顺序）；consecutive（连续的）；subsequent（随后的）','与跟随相关；拆分只作记忆线索。']];document.getElementById('study').innerHTML=units.map(([a,b,c,d])=>`<div class="unit"><strong>${a}</strong> <span>${b}</span><div class="examples">例词：${c}</div><div class="note">${d}</div></div>`).join('');
const quiz=[['dis- 在 disagree 中表达什么？',['共同','不/相反','向前','在下面'],1,'disagree = 不同意。'],['mis- 常表示什么？',['错误地','跨越','再次','相互'],0,'misunderstand = 误解。'],['anti- 常表示什么？',['支持','进入','反对/对抗','向后'],2,'如 antiwar（反战的）。antibiotic 整词表示抗生素。'],['词根 vert / vers 常与什么意思有关？',['写','转/转向','携带','看'],1,'如 reverse、convert。'],['词根 sequ 常与什么意思有关？',['跟随','建造','压','说'],0,'如 sequence、subsequent。'],['misunderstand 的意思是？',['误解','理解','反对','转向'],0,'mis- 常表示错误地。'],['reverse 的常见意思是？',['反转/颠倒','跟随','支持','分开'],0,'reverse = 反转、颠倒。'],['sequence 的意思是？',['顺序/一系列','反战','前任','错误'],0,'sequence = 顺序、一系列。'],['consecutive days 指什么？',['连续的几天','不同的几天','过去的几天','错误的几天'],0,'consecutive = 连续的。'],['subsequent 通常表示什么？',['随后的','相反的','可见的','共同的'],0,'subsequent = 随后的、后来的。'],['disappear 的意思是？',['出现','消失','反驳','预测'],1,'disappear = 消失。'],['convert 的意思是？',['转换/转变','描述','误解','携带'],0,'convert = 转换、转变。'],['以下哪一项是“误解”？',['disappear','misunderstand','reverse','sequence'],1,'misunderstand = 误解。'],['antiwar 的意思是？',['支持战争的','反战的','随后的','连续的'],1,'anti- 表示反对。'],['consequence 的常见意思是什么？',['后果/结果','转动','错误','反对'],0,'consequence = 后果、结果。']];let score=0,done=0;const letters=['A','B','C','D'],root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<div class="qtitle">${i+1}. ${q[0]}</div><div class="options"></div><div class="explain">💡 ${q[3]}</div>`;const opts=card.querySelector('.options');q[1].forEach((text,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>{if(b.disabled)return;[...opts.children].forEach(x=>x.disabled=true);if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q[2]].classList.add('correct')}card.querySelector('.explain').classList.add('show');done++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').hidden=false}};opts.appendChild(b)});root.appendChild(card)});
</script></body></html>
