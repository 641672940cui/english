<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Day 4 · 否定拓展与转换</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f5fb; padding: 14px 10px 30px; color: #1a2a3a; }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.4rem; color: #0b2b4a; border-left: 6px solid #2a7faa; padding-left: 14px; margin-bottom: 14px; }
    .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.05); }
    .card-title { font-weight: 700; font-size: 1.2rem; color: #134b6b; margin-bottom: 14px; border-bottom: 2px solid #e3edf5; padding-bottom: 8px; }
    .outline { background: #f4f9ff; border: 1px solid #d7e8f5; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .outline-title { font-weight: 700; color: #0c5879; margin-bottom: 6px; }
    .outline-list { list-style: disc; padding-left: 18px; color: #45627c; font-size: 0.9rem; line-height: 1.7; }
    .learn-card { background: #fafdff; border: 1px solid #e3ecf5; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .learn-title { font-size: 1.15rem; font-weight: 700; color: #b13e2e; }
    .learn-en { font-size: 0.85rem; color: #1f5880; font-weight: 600; background: #e3edf5; display: inline-block; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
    .learn-img { font-size: 0.9rem; color: #5c4328; margin: 8px 0; background: #fdfaf2; padding: 8px 10px; border-radius: 8px; border-left: 3px solid #d48c5c; }
    .family-toggle { display: block; width: 100%; background: #e3edf5; border: none; padding: 8px; border-radius: 8px; font-size: 0.85rem; color: #1f5880; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .family-list { display: none; list-style: none; padding: 0; margin-top: 10px; border-top: 1px dashed #d0dfec; padding-top: 10px; }
    .family-list.open { display: block; }
    .family-list li { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 6px 0; border-bottom: 1px dotted #e0eaf2; }
    .fam-word { font-weight: 600; color: #b13e2e; width: 120px; }
    .fam-break { color: #666; flex: 1; font-size: 0.82rem; margin-left: 8px; }
    .fam-mean { color: #1a4d6b; text-align: right; font-size: 0.85rem; width: 90px; }
    .quiz-card { background: #f8fbff; border: 1px solid #d5e4f1; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .quiz-question { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; }
    .quiz-opt { background: white; border: 1px solid #c9dae8; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; margin-bottom: 8px; }
    .quiz-opt.correct { background: #d4edda; border-color: #28a745; }
    .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; }
    .quiz-explain { display: none; margin-top: 10px; font-size: 0.85rem; color: #1a4d6b; background: #e3edf5; padding: 8px; border-radius: 8px; }
    .quiz-explain.show { display: block; }
    .score-board { background: #e3edf5; padding: 8px 16px; border-radius: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 16px; }
    .btn { background: #1f5880; color: white; border: none; padding: 12px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn-next { background: #1a7a3a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Day 4 · 否定拓展与转换</h1>
    <div class="card">
      <div class="card-title">1. 认零件（前缀 + 词根）</div>
      <div class="outline">
        <div class="outline-title">中学词根大纲定位</div>
        <ul class="outline-list">
          <li>前缀：dis-（不/分开）；mis-（错误地）；anti-（反对/对抗）</li>
          <li>词根：vert/vers（转）；sequ（跟随）</li>
          <li>重点：词义常常需要结合整体词来理解，不能只看字面成分</li>
        </ul>
      </div>
      <div id="learnContainer"></div>
      <button class="btn" onclick="switchTab('quiz')">✅ 学完了，去刷题 (15题)</button>
    </div>
    <div class="card" id="quizCard" style="display:none;">
      <div class="card-title">2. 刷题库</div>
      <div class="score-board"><span>📊 得分: <strong id="scoreDisplay">0</strong> / 15</span><span id="progressText">进度: 0%</span></div>
      <div id="quizContainer"></div>
    </div>
  </div>

  <script>
    const learnData = [
      {
        title: 'dis-',
        en: 'not / apart',
        img: 'disagree（不同意）；disappear（消失）；disconnect（断开）',
        family: [
          { word: 'dis-', mean: '不；分开' },
          { word: 'disagree', mean: '不同意' },
          { word: 'disappear', mean: '消失' },
          { word: 'disconnect', mean: '断开' }
        ]
      },
      {
        title: 'mis-',
        en: 'wrongly / badly',
        img: 'misunderstand（误解）；misplace（放错）；misread（误读）',
        family: [
          { word: 'mis-', mean: '错误地' },
          { word: 'misunderstand', mean: '误解' },
          { word: 'misplace', mean: '放错' },
          { word: 'misread', mean: '误读' }
        ]
      },
      {
        title: 'anti-',
        en: 'against / opposite',
        img: 'antiwar（反战）；antibiotic（抗生素）；antisocial（反社会的）',
        family: [
          { word: 'anti-', mean: '反对；对抗' },
          { word: 'antiwar', mean: '反战的' },
          { word: 'antibiotic', mean: '抗生素' },
          { word: 'antisocial', mean: '反社会的' }
        ]
      },
      {
        title: 'vert / vers',
        en: 'turn',
        img: 'reverse（反转）；convert（转换）；version（版本）',
        family: [
          { word: 'vert', mean: '转' },
          { word: 'vers', mean: '转' },
          { word: 'reverse', mean: '反转' },
          { word: 'convert', mean: '转换' }
        ]
      },
      {
        title: 'sequ / secut',
        en: 'follow',
        img: 'sequence（顺序）；consecutive（连续的）；subsequent（随后的）',
        family: [
          { word: 'sequ', mean: '跟随' },
          { word: 'secut', mean: '跟随/继承' },
          { word: 'sequence', mean: '顺序' },
          { word: 'subsequent', mean: '随后的' }
        ]
      }
    ];

    const questions = [
      { q: 'dis- 在 disagree 中表达什么？', options: ['共同', '不/相反', '向前', '在下面'], answer: 1, explain: 'disagree = 不同意。' },
      { q: 'mis- 常表示什么？', options: ['错误地', '跨越', '再次', '相互'], answer: 0, explain: 'misunderstand = 误解。' },
      { q: 'anti- 常表示什么？', options: ['支持', '进入', '反对/对抗', '向后'], answer: 2, explain: '如 antiwar（反战的）。' },
      { q: '词根 vert / vers 常与什么意思有关？', options: ['写', '转/转向', '携带', '看'], answer: 1, explain: '如 reverse、convert。' },
      { q: '词根 sequ 常与什么意思有关？', options: ['跟随', '建造', '压', '说'], answer: 0, explain: '如 sequence、subsequent。' },
      { q: 'misunderstand 的意思是？', options: ['误解', '理解', '反对', '转向'], answer: 0, explain: 'mis-（错误地） + understand。' },
      { q: 'reverse 的常见意思是？', options: ['反转/颠倒', '跟随', '支持', '分开'], answer: 0, explain: 'reverse = 反转。' },
      { q: 'sequence 的意思是？', options: ['顺序/一系列', '反战', '前任', '错误'], answer: 0, explain: 'sequence = 顺序。' },
      { q: 'consecutive days 指什么？', options: ['连续的几天', '不同的几天', '过去的几天', '错误的几天'], answer: 0, explain: 'consecutive = 连续的。' },
      { q: 'subsequent 通常表示什么？', options: ['随后的', '相反的', '可见的', '共同的'], answer: 0, explain: 'subsequent = 随后的。' },
      { q: 'disappear 的意思是？', options: ['出现', '消失', '反驳', '预测'], answer: 1, explain: 'disappear = 消失。' },
      { q: 'convert 的意思是？', options: ['转换/转变', '描述', '误解', '携带'], answer: 0, explain: 'convert = 转换。' },
      { q: '以下哪一项是“误解”？', options: ['disappear', 'misunderstand', 'reverse', 'sequence'], answer: 1, explain: 'misunderstand = 误解。' },
      { q: 'antiwar 的意思是？', options: ['支持战争的', '反战的', '随后的', '连续的'], answer: 1, explain: 'anti-（反对） + war。' },
      { q: 'consequence 的常见意思是什么？', options: ['后果/结果', '转动', '错误', '反对'], answer: 0, explain: 'consequence = 结果、后果。' }
    ];

    function renderLearn() {
      const container = document.getElementById('learnContainer');
      container.innerHTML = learnData.map(item => `
        <div class="learn-card">
          <div class="learn-title">${item.title}<span class="learn-en">${item.en}</span></div>
          <div class="learn-img">${item.img}</div>
          <button class="family-toggle" onclick="toggleFamily(this)">📚 词族 / 词根速记</button>
          <ul class="family-list">
            ${item.family.map(f => `
              <li>
                <span class="fam-word">${f.word}</span>
                <span class="fam-break">${f.word.includes('-') ? '词缀' : '词根'}</span>
                <span class="fam-mean">${f.mean}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
    }

    function toggleFamily(button) {
      const list = button.nextElementSibling;
      list.classList.toggle('open');
    }

    function switchTab(tab) {
      const quizCard = document.getElementById('quizCard');
      if (tab === 'quiz') {
        quizCard.style.display = 'block';
        quizCard.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      let score = 0;
      let answered = 0;

      questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
          <div class="quiz-question">${index + 1}. ${q.q}</div>
          <div class="quiz-options"></div>
          <div class="quiz-explain">💡 ${q.explain}</div>
        `;

        const optionWrap = card.querySelector('.quiz-options');
        q.options.forEach((opt, optIndex) => {
          const button = document.createElement('button');
          button.className = 'quiz-opt';
          button.textContent = `${String.fromCharCode(65 + optIndex)}. ${opt}`;
          button.onclick = () => {
            if (button.dataset.locked) return;
            button.dataset.locked = 'true';
            const allButtons = [...optionWrap.querySelectorAll('.quiz-opt')];
            allButtons.forEach(btn => btn.disabled = true);

            if (optIndex === q.answer) {
              button.classList.add('correct');
              score += 1;
            } else {
              button.classList.add('wrong');
              allButtons[q.answer].classList.add('correct');
            }

            card.querySelector('.quiz-explain').classList.add('show');
            answered += 1;
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('progressText').textContent = `进度: ${Math.round((answered / questions.length) * 100)}%`;
          };
          optionWrap.appendChild(button);
        });

        container.appendChild(card);
      });
    }

    renderLearn();
    renderQuiz();
  </script>
</body>
</html>
