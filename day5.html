<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 5 · 方位拓展与施压</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0014220d}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.note{font-size:.9rem;color:#596d7d;line-height:1.65}.outline,.unit{padding:12px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:12px;margin:10px 0}.outline strong,.unit strong{color:#b13e2e}.examples{color:#32556c;line-height:1.7;margin-top:6px}.question{padding:14px;background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;margin:12px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.options{display:grid;gap:7px}.opt,.btn{font:inherit}.opt{padding:10px 12px;border:1px solid #c9dae8;background:#fff;border-radius:9px;text-align:left;cursor:pointer}.opt:hover{background:#e6f0f8}.opt.correct{background:#d4edda;border-color:#28a745}.opt.wrong{background:#f8d7da;border-color:#dc3545}.explain{display:none;margin-top:9px;padding:9px;background:#e3edf5;border-radius:8px;font-size:.88rem}.explain.show{display:block}.score{display:flex;justify-content:space-between;background:#e3edf5;padding:10px;border-radius:10px;font-weight:600}.btn{border:0;border-radius:30px;background:#1f5880;color:white;padding:11px 16px;cursor:pointer;width:100%;margin-top:12px}.finish{text-align:center;padding:15px}</style></head><body><main class="wrap"><section class="panel"><h1>Day 5 · 方位拓展与施压</h1><p class="note">中学词根大纲：inter-（在……之间/相互）、super-（上方/超越）、ex-（向外；前任）；press（压）、mit/miss（送出/放出）。重点记高频词义与用法，避免把构词成分机械拼接成释义。</p><div id="study"></div><button class="btn" onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">开始15题练习</button></section><section class="panel" id="quiz"><h2>自测（15题）</h2><div class="score"><span>答对：<b id="score">0</b> / 15</span><span id="progress">进度：0%</span></div><div id="questions"></div><div class="finish" id="finish" hidden>完成！本轮得分：<b id="finalScore"></b> / 15 <button class="btn" onclick="location.reload()">再练一次</button></div></section></main><script>
const units=[['inter-','between / among','international（国际的）；interact（互动）；interview（采访）','常见义是在……之间、相互。'],['super-','above / beyond','superpower（超能力）；supermarket（超市）；superior（上等的）','可表示在上方或超越；具体词义看整词。'],['ex-','out / former','export（出口）；exit（出口/离开）；ex-president（前总统）','常见义是向外、出；身份词前可表示前任。'],['press','press / push','pressure（压力）；compress（压缩）；express（表达）','与压、挤压相关；express 的整体义常见为表达。'],['mit / miss','send / let go','transmit（传输）；admit（承认/准许进入）；dismiss（解散/解雇）','来自与送出、放出有关的词根；具体词义按整词记。']];document.getElementById('study').innerHTML=units.map(([a,b,c,d])=>`<div class="unit"><strong>${a}</strong> <span>${b}</span><div class="examples">例词：${c}</div><div class="note">${d}</div></div>`).join('');
const quiz=[['inter- 常表示什么？',['在下面','在……之间/相互','向外','超越'],1,'如 international、interact。'],['super- 的常见方向联想是什么？',['在下方','在……之间','在上方/超越','向外'],2,'super- 常表示上方或超越。'],['export 中 ex- 的意思最接近什么？',['向外/出','向内','向后','之间'],0,'export = 出口。'],['ex-president 中 ex- 表示什么？',['在职的','前任的','超越的','内部的'],1,'ex-president = 前总统。'],['press 常与什么意思有关？',['说','压/挤压','携带','跟随'],1,'如 pressure、compress。'],['mit / miss 常与什么意思有关？',['送出/放出','压','建造','转'],0,'如 transmit、dismiss。'],['pressure 的意思是？',['压力','前任','互动','任务'],0,'pressure = 压力。'],['compress 的意思是？',['表达','压缩','允许','传输'],1,'compress = 压缩。'],['transmit 的意思是？',['提交','传输','解雇','承认'],1,'transmit = 传输。'],['dismiss 的常见意思是？',['解散/解雇','允许','印象','超自然'],0,'dismiss = 解散、解雇。'],['admit 常见意思包括哪一项？',['压缩','承认/准许进入','出口','互动'],1,'admit = 承认；也可表示准许进入。'],['international 表示什么？',['国内的','国际的','超自然的','前任的'],1,'international = 国际的。'],['express 的常见意思是什么？',['表达/明确说出','允许','向下','在……之间'],0,'express = 表达；词根拆分只作记忆提示。'],['哪一组“前缀/词根—常见义”匹配正确？',['inter-—向外；press—携带','ex-—之间；mit—压','super-—超越；press—压','mit—建造；inter-—向下'],2,'super- 有超越义；press 与压相关。'],['superpower 的意思最接近什么？',['超能力/超级大国','前任','国际','压力'],0,'superpower 可表示超能力或超级大国。']];let score=0,done=0;const letters=['A','B','C','D'],root=document.getElementById('questions');quiz.forEach((q,i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<div class="qtitle">${i+1}. ${q[0]}</div><div class="options"></div><div class="explain">💡 ${q[3]}</div>`;const opts=card.querySelector('.options');q[1].forEach((text,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${letters[j]}. ${text}`;b.onclick=()=>{if(b.disabled)return;[...opts.children].forEach(x=>x.disabled=true);if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');opts.children[q[2]].classList.add('correct')}card.querySelector('.explain').classList.add('show');done++;document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`进度：${Math.round(done/quiz.length*100)}%`;if(done===quiz.length){document.getElementById('finalScore').textContent=score;document.getElementById('finish').hidden=false}};opts.appendChild(b)});root.appendChild(card)});
</script></body></html>
