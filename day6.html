<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 6 · 基础营复习</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f5fb;color:#1a2a3a;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto}.progress{display:flex;justify-content:space-between;background:#fff;padding:11px 16px;border:1px solid #e0eaf2;border-radius:32px;margin-bottom:16px}.step{color:#91a5b7;font-size:.86rem;font-weight:600}.step.active{color:#1f5880}.step.done{color:#1a7a3a}.page{display:none;background:#fff;border:1px solid #e6eef6;border-radius:18px;padding:20px;box-shadow:0 5px 16px #0014220d}.page.active{display:block}h1,h2{color:#134b6b;margin:0 0 14px}h1{font-size:1.35rem}.intro,.score{background:#f4f9ff;border:1px solid #d7e8f5;border-radius:12px;padding:14px;line-height:1.7;color:#45627c}.score{display:flex;justify-content:space-between;font-weight:600;color:#1f5880;margin-bottom:14px}.note{font-size:.87rem;color:#667b8c;line-height:1.65;margin-top:10px}.question{background:#f8fbff;border:1px solid #d5e4f1;border-radius:14px;padding:15px;margin:12px 0}.qtitle{font-weight:650;line-height:1.5;margin-bottom:10px}.options{display:grid;gap:8px}.option{font:inherit;text-align:left;background:#fff;border:1px solid #c9dae8;padding:10px 12px;border-radius:9px;cursor:pointer}.option:hover:not(:disabled){background:#e6f0f8}.option:disabled{cursor:default;opacity:1}.option.correct{background:#d4edda;border-color:#28a745;color:#155724;font-weight:700}.option.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24;font-weight:700}.explanation{display:none;background:#e3edf5;border-radius:8px;padding:9px 11px;margin-top:10px;font-size:.88rem;line-height:1.55}.explanation.show{display:block}.btn{display:block;width:100%;margin-top:14px;padding:12px 18px;border:0;border-radius:28px;background:#1f5880;color:white;font:inherit;font-weight:600;cursor:pointer}.btn.green{background:#1a7a3a}.finish{text-align:center;padding:24px 8px}.final{font-size:1.5rem;color:#1a7a3a;font-weight:700}.comment{color:#45627c;line-height:1.6}@media(max-width:520px){.page{padding:15px}.step{font-size:.76rem}.score{font-size:.84rem;padding:10px}}
</style></head><body><main class="wrap">
<nav class="progress" aria-label="复习进度"><span class="step active">1. 考前须知</span><span class="step">2. 综合复习（20题）</span><span class="step">3. 结算</span></nav>
<section class="page active"><h1>Day 6：Day 1–5 综合复习</h1><div class="intro"><strong>复习范围：</strong>Day 1–5 学过的常见前缀和词根。<br>共 <strong>20 道选择题</strong>，作答后显示答案和简要解释。<p class="note">词根词缀是记忆和理解单词的线索。具体词义以常用义和语境为准，不要把每个词都机械地按部件直译。</p></div><button class="btn green" onclick="goToPage(1)">开始复习</button></section>
<section class="page"><h2>综合复习（20题）</h2><div class="score"><span>答对：<b id="score">0</b> / 20</span><span id="progressText">进度：0%</span></div><div id="questions"></div><button class="btn green" id="finishButton" hidden onclick="showResults()">完成练习，查看成绩</button></section>
<section class="page"><div class="finish"><h2>Day 6 复习完成！</h2><p>最终得分：<span class="final" id="finalScore">0</span> / 20</p><p class="comment" id="comment"></p><button class="btn" onclick="location.reload()">再练一次</button></div></section>
</main><script>
const data=[
['前缀 trans- 在 transport 中最适合联想到什么？',['跨越、从一处到另一处','向内','再次','错误地'],0,'trans- 常有“跨越、从一处到另一处”的意思；transport 是“运输、运送”。'],
['前缀 mis- 在 misunderstand 中表示什么？',['在下面','错误地','超越','向外'],1,'mis- 常表示“错误地”；misunderstand 是“误解”。'],
['anti- 的常见意思是什么？',['共同','再次','反对、对抗','向内'],2,'anti- 常表示“反对、对抗”，如 antiwar（反战的）。'],
['super- 在常见词汇中可以表示什么？',['在下面','在两者之间','错误地','在上方、超越'],3,'super- 常有“在上方、超越”的意思；具体单词仍���结合语境理解。'],
['co- / con- 常表示什么？',['分开','共同、一起','向外','之前'],1,'co- / con- 常有“共同、一起”的意思，如 cooperate（合作）。'],
['词根 struct 常与什么含义有关？',['建造、构筑','说','看','携带'],0,'struct 与建造、构筑相关，如 structure（结构）、construct（建造）。'],
['词根 vert / vers 常与什么含义有关？',['压','写','转、转向','跟随'],2,'vert / vers 与“转”有关，如 reverse（反转）、convert（转换）。'],
['词根 mit / miss 常与什么含义有关？',['建造','看','说','送出、放出'],3,'mit / miss 来自与“送出、放出”有关的词根，如 transmit（传输）。'],
['词根 sequ 常与什么含义有关？',['跟随','压','写','携带'],0,'sequ 与“跟随”有关，如 sequence（顺序）、subsequent（随后的）。'],
['词根 press 常与什么含义有关？',['看','压、挤压','说','建造'],1,'press 与压、挤压有关，如 pressure（压力）、compress（压缩）。'],
['port 在 import / export 中常与什么含义有关？',['书写','判断','携带、运送','转动'],2,'port 与携带、运送有关：import 是进口，export 是出口。'],
['inspect 的常见意思是什么？',['反驳','运输','预测','检查'],3,'inspect = 检查、仔细���看。词根拆分可以辅助记忆，但不必逐字翻译。'],
['dict 常与哪个意思有关？',['说、讲','拉、拖','形成','压'],0,'dict 与“说、讲”有关，如 predict（预测）、dictionary（字典）。'],
['duc / duct 常与哪个意思有关？',['携带','引导、带领','转动','看'],1,'duc / duct 与引导、带领有关，如 conduct（指挥、引导）。'],
['词根 tract 常与哪个意思有关？',['写','说','拉、拖','听'],2,'tract 与拉、拖有关，如 attract（吸引）、extract（提取）。'],
['以下哪组匹配正确？',['pre- — 错误地','sub- — 跨越','anti- — 再次','re- — 再次/向回'],3,'re- 常表示“再次”或“向回”；其他选项把前缀含义配错了。'],
['misunderstand 的常见意思是什么？',['误解','介绍','压缩','运输'],0,'misunderstand = 误解；mis- 常表示错误地。'],
['support 的常见意思是什么？',['预测','支持、支撑','消失','反转'],1,'support = 支持、支撑。记忆拆分可以辅助理解，但整词含义优先。'],
['underestimate 的意思是什么？',['高估','运输','低估','介绍'],2,'underestimate = 低估；under- 在这里有“不足、低于”的联想。'],
['哪一项把常见词义配对正确？',['contradict — 支持','extract — 描述','pressure — 观众','transmit — 传输'],3,'transmit = 传输；其他三项的词义配对不正确。']
];
let score=0,answered=0;const letters=['A','B','C','D'],root=document.getElementById('questions');
data.forEach((q,i)=>{const card=document.createElement('article');card.className='question';const title=document.createElement('div');title.className='qtitle';title.textContent=`${i+1}. ${q[0]}`;const options=document.createElement('div');options.className='options';q[1].forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=`${letters[j]}. ${text}`;b.addEventListener('click',()=>answer(i,j,b));options.appendChild(b)});const exp=document.createElement('div');exp.className='explanation';exp.textContent='💡 '+q[3];card.append(title,options,exp);root.appendChild(card)});
function answer(i,j,b){const q=data[i],card=b.closest('.question'),buttons=[...card.querySelectorAll('.option')];if(buttons.some(x=>x.disabled))return;buttons.forEach(x=>x.disabled=true);if(j===q[2]){b.classList.add('correct');score++}else{b.classList.add('wrong');buttons[q[2]].classList.add('correct')}card.querySelector('.explanation').classList.add('show');answered++;document.getElementById('score').textContent=score;document.getElementById('progressText').textContent=`进度：${Math.round(answered/data.length*100)}%`;if(answered===data.length)document.getElementById('finishButton').hidden=false}
function goToPage(i){const pages=[...document.querySelectorAll('.page')],steps=[...document.querySelectorAll('.step')];pages.forEach((p,n)=>p.classList.toggle('active',n===i));steps.forEach((s,n)=>{s.classList.toggle('active',n===i);s.classList.toggle('done',n<i)});window.scrollTo(0,0)}function showResults(){document.getElementById('finalScore').textContent=score;document.getElementById('comment').textContent=score>=18?'基础掌握很扎实！':score>=14?'表现不错，建议复习错题。':'建议回看 Day 1–5 的重点词缀和词根，再试一次。';goToPage(2)}
</script></body></html>
