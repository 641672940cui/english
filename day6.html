<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Day 6 · 基础营大考 (修正版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f5fb; padding: 14px 10px 30px; color: #1a2a3a; }
    .container { max-width: 820px; margin: 0 auto; }
    
    .progress-bar { display: flex; justify-content: space-between; background: white; padding: 10px 16px; border-radius: 40px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e0eaf2; }
    .step { font-size: 0.85rem; font-weight: 600; color: #a0b5c8; }
    .step.active { color: #1f5880; }
    .step.done { color: #1a7a3a; }

    .page { display: none; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 6px 18px rgba(0, 20, 30, 0.08); border: 1px solid #e6eef6; }
    .page.active { display: block; }
    h2 { font-size: 1.2rem; color: #134b6b; margin-bottom: 14px; border-bottom: 2px solid #e3edf5; padding-bottom: 8px; }
    
    .score-board { background: #e3edf5; padding: 8px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; color: #1f5880; margin-bottom: 16px; display: flex; justify-content: space-between; }

    .btn { background: #1f5880; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; transition: 0.2s; }
    .btn:hover { background: #13466a; }
    
    .quiz-card { background: #f8fbff; border: 1px solid #d5e4f1; border-radius: 16px; padding: 16px; margin-bottom: 14px; transition: 0.3s; }
    .quiz-question { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; line-height: 1.5; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt { background: white; border: 1px solid #c9dae8; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
    .quiz-opt:hover { background: #e6f0f8; }
    .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: 700; }
    .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; font-weight: 700; }
    .quiz-explain { display: none; margin-top: 10px; font-size: 0.85rem; color: #1a4d6b; background: #e3edf5; padding: 8px 12px; border-radius: 8px; }
    .quiz-explain.show { display: block; }
    
    .feedback-ok { box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); border-color: #28a745; }
    .feedback-no { box-shadow: 0 0 10px rgba(220, 53, 69, 0.4); border-color: #dc3545; }

    .finish-msg { text-align: center; padding: 30px 10px; display: none; }
    .finish-msg.show { display: block; }
    .finish-msg h3 { color: #1a7a3a; font-size: 1.3rem; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="container">
  
  <div class="progress-bar" id="progressBar">
    <span class="step active" id="step-0">1. 考前须知</span>
    <span class="step" id="step-1">2. 混合大考(20题)</span>
    <span class="step" id="step-2">🏆 结算</span>
  </div>

  <div class="page active" id="page-0">
    <h2>Day 6：基础营大考</h2>
    <div class="learn-card" style="text-align:center; padding: 30px 20px;">
      <h3 style="color:#1f5880; margin-bottom:16px;">📝 考试说明</h3>
      <p style="color:#555; line-height:1.8; font-size:0.95rem;">
        本卷包含 Day 1 - Day 5 的所有核心前缀与词根。<br>
        共 <strong>20 道选择题</strong>，包含以下题型：<br>
        <strong>1. 前缀含义秒判</strong><br>
        <strong>2. 词根画面反应</strong><br>
        <strong>3. 单词拼装组合</strong><br>
        <strong>4. 纠错找茬 (反向推理)</strong>
      </p>
      <p style="color:#b13e2e; font-weight:600; margin-top:16px;">请勿凭感觉猜，在脑中构建画面！</p>
    </div>
    <button class="btn" onclick="goToPage(1)" style="background:#1a7a3a;">🚀 开始考试</button>
  </div>

  <div class="page" id="page-1">
    <h2>混合大考 (20题)</h2>
    <div class="score-board">
      <span>📊 已答对: <strong id="scoreDisplay">0</strong> / 20</span>
      <span id="progressText">进度: 0%</span>
    </div>
    <div id="quizContainer"></div>
    <button class="btn" onclick="goToPage(2)" id="btn-finish" style="display:none; background:#1a7a3a;">🏆 交卷，查看成绩</button>
  </div>

  <div class="page" id="page-2">
    <div class="finish-msg show" style="display:block;">
      <h3 id="finishTitle">🎉 考试结束！</h3>
      <p style="color:#555; margin:10px 0; font-size:1.1rem;">最终得分：<strong id="finalScore" style="color:#1a7a3a; font-size:1.5rem;"></strong> / 20</p>
      <div id="comment" style="margin-top:10px; font-weight:600; color:#1f5880;"></div>
      <button class="btn" onclick="location.reload()" style="margin-top:20px;">🔄 重新考试</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// Day 6 混合大考题库 (修正版)
// ==========================================

const quizData = [
  // 1-5: 前缀含义秒判
  { q: "前缀 'trans-' 的画面感是？", opts: ["A. 向内", "B. 跨越/通过", "C. 向后", "D. 共同"], ans: 1, exp: "trans- = 跨越。transport(运输) 就是跨越两地搬运。" },
  { q: "前缀 'mis-' 的核心含义是？", opts: ["A. 错误地", "B. 在下面", "C. 超越", "D. 向外"], ans: 0, exp: "mis- = 错误地。mistake(错误) 就是拿错了。" },
  { q: "以下哪个前缀表示 '否定 / 相反'？", opts: ["A. pro-", "B. sub-", "C. anti-", "D. inter-"], ans: 2, exp: "anti- = 对抗/反对。antisocial(反社会的)。" },
  { q: "单词 supermarket 中的 'super-' 表示？", opts: ["A. 在下面", "B. 超越/在上方", "C. 之间", "D. 向外"], ans: 1, exp: "super- = 在上方/超越。supermarket 就是比普通市场大的市场。" },
  { q: "前缀 'con-' 的画面感是？", opts: ["A. 分开", "B. 共同/一起", "C. 向外", "D. 错误"], ans: 1, exp: "con- = 共同。connect(连接) 就是连在一起。" },

  // 6-10: 词根画面反应
  { q: "词根 'press' 的底层画面是？", opts: ["A. 看", "B. 压", "C. 写", "D. 送"], ans: 1, exp: "press = 压。pressure(压力)。" },
  { q: "词根 'vert / vers' 代表什么动作？", opts: ["A. 转", "B. 建造", "C. 跟随", "D. 压"], ans: 0, exp: "vert/vers = 转。reverse(反转) 就是向后转。" },
  { q: "词根 'struct' 的画面是？", opts: ["A. 压", "B. 建造/堆砌", "C. 写", "D. 送"], ans: 1, exp: "struct = 建造。structure(结构)。" },
  { q: "词根 'mit / miss' 代表什么动作？", opts: ["A. 引导", "B. 送/放出", "C. 转", "D. 压"], ans: 1, exp: "mit/miss = 送/放出。mission(任务)。" },
  { q: "词根 'sequ' 的底层画面是？", opts: ["A. 跟随", "B. 建造", "C. 压", "D. 写"], ans: 0, exp: "sequ = 跟随。sequence(顺序) 就是一个跟一个。" },

  // 11-15: 单词拼装组合
  { q: "trans + port = ?", opts: ["A. 进口", "B. 出口", "C. 运输", "D. 支持"], ans: 2, exp: "trans(跨越) + port(带) ➡️ 跨越两地运输。" },
  { q: "in + spect = ?", opts: ["A. 检查", "B. 尊敬", "C. 描述", "D. 预测"], ans: 0, exp: "in(向内) + spect(看) ➡️ 向里面看 ➡️ 检查。" },
  { q: "de + struct = ?", opts: ["A. 建设", "B. 破坏", "C. 指导", "D. 结构"], ans: 1, exp: "de(向下/反) + struct(建) ➡️ 反向建造 ➡️ 破坏。" },
  { q: "con + vert = ?", opts: ["A. 转换", "B. 反转", "C. 多样", "D. 宇宙"], ans: 0, exp: "con(共同) + vert(转) ➡️ 完全转过来 ➡️ 转换。" },
  { q: "ex + press = ?", opts: ["A. 表达", "B. 印象", "C. 压抑", "D. 压缩"], ans: 0, exp: "ex(向外) + press(压) ➡️ 向外挤出 ➡️ 表达。" },

  // 16-20: 纠错找茬 / 反向推理
  { q: "【找茬】以下哪个单词的拆解是【错误】的？", opts: ["A. predict = pre(预先) + dict(说)", "B. transport = trans(跨越) + port(带)", "C. instruct = in(向外) + struct(建)", "D. describe = de(向下) + scrib(写)"], ans: 2, exp: "C 错误。instruct 的 in- 应该是“向内”（在头脑内部建构），不是“向外”。" },
  { q: "【找茬】以下哪个单词的拆解是【错误】的？", opts: ["A. dismiss = dis(分开) + miss(送)", "B. export = ex(向外) + port(带)", "C. subtract = sub(在下) + tract(拉)", "D. permit = per(通过) + mit(说)"], ans: 3, exp: "D 错误。mit 不是“说”，而是“送”。permit 是“让……通过（送过去）”。" },
  { q: "【反推】如果 'pre' = 预先，'scrib' = 写，那么“预先写好的药方”是哪个词？", opts: ["A. describe", "B. prescribe", "C. predict", "D. dictate"], ans: 1, exp: "pre(预先) + scrib(写) ➡️ 预先写好的东西 ➡️ 开处方。" },
  { q: "【反推】如果 'inter' = 之间，'national' = 国家的，那么“国家之间的”是哪个词？", opts: ["A. supernatural", "B. international", "C. interaction", "D. transport"], ans: 1, exp: "inter(之间) + national(国家的) ➡️ international(国际的)。" },
  { q: "【反推】如果 'dis' = 分开，'tract' = 拉，那么“把注意力拉开”是哪个词？", opts: ["A. attract", "B. extract", "C. distract", "D. contract"], ans: 2, exp: "dis(分开) + tract(拉) ➡️ 把注意力拉开 ➡️ distract(分心)。" }
];

// ==========================================
// 渲染与逻辑区
// ==========================================

let correctCount = 0;
let answeredCount = 0;
const quizContainer = document.getElementById('quizContainer');
quizData.forEach((q, idx) => {
  let html = `<div class="quiz-card" id="qcard-${idx}"><div class="quiz-question">${idx+1}. ${q.q}</div><div class="quiz-options">`;
  q.opts.forEach((opt, oi) => {
    html += `<div class="quiz-opt" onclick="checkAnswer(${idx}, ${oi}, this)">${opt}</div>`;
  });
  html += `</div><div class="quiz-explain" id="exp-${idx}">💡 ${q.exp}</div></div>`;
  quizContainer.innerHTML += html;
});

function checkAnswer(qIdx, oIdx, el) {
  const q = quizData[qIdx];
  const parent = el.parentElement;
  const card = document.getElementById(`qcard-${qIdx}`);
  Array.from(parent.children).forEach(c => c.style.pointerEvents = 'none');
  
  if(oIdx === q.ans) {
    el.classList.add('correct');
    card.classList.add('feedback-ok');
    correctCount++;
  } else {
    el.classList.add('wrong');
    parent.children[q.ans].classList.add('correct');
    card.classList.add('feedback-no');
  }
  
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  answeredCount++;
  document.getElementById('scoreDisplay').innerText = correctCount;
  let percent = Math.round((answeredCount / quizData.length) * 100);
  document.getElementById('progressText').innerText = `进度: ${percent}%`;
  
  if(answeredCount === quizData.length) {
    document.getElementById('btn-finish').style.display = 'block';
    document.getElementById('finalScore').innerText = correctCount;
    
    let commentText = '';
    if(correctCount >= 18) commentText = "🏆 词根词缀大师！基础营完美通关！";
    else if(correctCount >= 15) commentText = "🌟 表现优秀！只有几个小盲区，复习一下错题即可。";
    else if(correctCount >= 12) commentText = "💪 基础扎实，但部分画面感还不稳固，建议重新看 Day 1-5 的折叠卡片。";
    else commentText = "🌱 别灰心！把错题的解析多读几遍，在大脑里放慢电影。";
    document.getElementById('comment').innerText = commentText;
  }
}

function goToPage(pageIdx) {
  document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i === pageIdx));
  document.querySelectorAll('.step').forEach((s, i) => {
    s.classList.remove('active', 'done');
    if(i < pageIdx) s.classList.add('done');
    if(i === pageIdx) s.classList.add('active');
  });
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
