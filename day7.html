<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Day 7 · 认知与情感 (含错题本)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f5fb;
      padding: 14px 10px 30px;
      color: #1a2a3a;
    }
    .container { max-width: 820px; margin: 0 auto; }
    h1 {
      font-size: 1.4rem;
      color: #0b2b4a;
      border-left: 6px solid #2a7faa;
      padding-left: 14px;
      margin-bottom: 14px;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      background: white;
      padding: 10px 16px;
      border-radius: 40px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e0eaf2;
    }
    .step { font-size: 0.85rem; font-weight: 600; color: #a0b5c8; }
    .step.active { color: #1f5880; }
    .step.done { color: #1a7a3a; }

    .page {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0, 20, 30, 0.08);
      border: 1px solid #e6eef6;
    }
    .page.active { display: block; }
    h2 {
      font-size: 1.2rem;
      color: #134b6b;
      margin-bottom: 14px;
      border-bottom: 2px solid #e3edf5;
      padding-bottom: 8px;
    }

    .learn-card {
      background: #fafdff;
      border: 1px solid #e3ecf5;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .learn-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #b13e2e;
    }
    .learn-en {
      font-size: 0.85rem;
      color: #1f5880;
      font-weight: 600;
      background: #e3edf5;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }
    .learn-img {
      font-size: 0.9rem;
      color: #5c4328;
      margin: 8px 0;
      background: #fdfaf2;
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid #d48c5c;
    }
    .learn-origin {
      font-size: 0.82rem;
      color: #6d8aa3;
      font-style: italic;
      margin-top: 6px;
      padding-left: 4px;
    }

    .family-toggle {
      display: block;
      width: 100%;
      background: #e3edf5;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #1f5880;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }
    .family-list {
      display: none;
      list-style: none;
      padding: 0;
      margin-top: 10px;
      border-top: 1px dashed #d0dfec;
      padding-top: 10px;
    }
    .family-list.open { display: block; }
    .family-list li {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 6px 0;
      border-bottom: 1px dotted #e0eaf2;
    }
    .fam-word {
      font-weight: 600;
      color: #b13e2e;
      width: 120px;
    }
    .fam-break {
      color: #666;
      flex: 1;
      font-size: 0.82rem;
      margin-left: 8px;
    }
    .fam-mean {
      color: #1a4d6b;
      text-align: right;
      font-size: 0.85rem;
      width: 90px;
    }

    .btn {
      background: #1f5880;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
      transition: 0.2s;
    }
    .btn:hover { background: #13466a; }
    .btn-next { background: #1a7a3a; }
    .btn-wrong { background: #b13e2e; }

    .quiz-card {
      background: #f8fbff;
      border: 1px solid #d5e4f1;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      transition: 0.3s;
    }
    .quiz-question {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt {
      background: white;
      border: 1px solid #c9dae8;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      text-align: left;
    }
    .quiz-opt:hover:not(:disabled) { background: #e6f0f8; }
    .quiz-opt:disabled { cursor: default; opacity: 1; }
    .quiz-opt.correct {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
      font-weight: 700;
    }
    .quiz-opt.wrong {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
      font-weight: 700;
    }
    .quiz-explain {
      display: none;
      margin-top: 10px;
      font-size: 0.85rem;
      color: #1a4d6b;
      background: #e3edf5;
      padding: 8px 12px;
      border-radius: 8px;
      line-height: 1.6;
    }
    .quiz-explain.show { display: block; }

    .feedback-ok {
      box-shadow: 0 0 10px rgba(40, 167, 69, 0.4);
      border-color: #28a745;
    }
    .feedback-no {
      box-shadow: 0 0 10px rgba(220, 53, 69, 0.4);
      border-color: #dc3545;
    }

    .finish-msg {
      text-align: center;
      padding: 30px 10px;
      display: none;
    }
    .finish-msg.show { display: block; }
    .finish-msg h3 {
      color: #1a7a3a;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }
    .score-board {
      background: #e3edf5;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1f5880;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .wrong-book {
      display: none;
      background: #fff5f5;
      border: 1px solid #f5c6cb;
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
    }
    .wrong-book.show { display: block; }
    .wrong-book h3 {
      color: #b13e2e;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }
    .wrong-item {
      background: white;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-left: 3px solid #dc3545;
      font-size: 0.9rem;
    }
    .wrong-item .q-text { font-weight: 600; margin-bottom: 4px; }
    .wrong-item .a-text { color: #1a7a3a; font-weight: 600; }
    .wrong-item .e-text {
      color: #6d8aa3;
      font-size: 0.82rem;
      margin-top: 4px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .progress-bar { padding: 9px 10px; }
      .step { font-size: 0.76rem; }
      .page { padding: 15px; }
      .score-board { font-size: 0.82rem; padding: 8px 10px; }
      .fam-word { width: 100px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="progress-bar" id="progressBar">
    <span class="step active" id="step-0">1. 认零件</span>
    <span class="step" id="step-1">2. 刷题库</span>
    <span class="step" id="step-2">🏆 通关</span>
  </div>

  <div class="page active" id="page-0">
    <h2>Day 7：认知与情感</h2>
    <p style="font-size:0.85rem; color:#666; margin-bottom:12px; line-height:1.7;">
      今天掌握：名词后缀 <strong>(-tion / -ment / -able)</strong> + 认知词根 <strong>(sci / cred / sens)</strong>。<br>
      <span style="color:#b13e2e; font-weight:600;">⚠️ 做错的题会自动收进错题本，重练更有效！</span>
    </p>
    <div id="learnContainer"></div>
    <button class="btn btn-next" onclick="goToPage(1)">✅ 学完了，去刷题</button>
  </div>

  <div class="page" id="page-1">
    <h2>题海演练：15题挑战</h2>
    <div class="score-board">
      <span>📊 已答对: <strong id="scoreDisplay">0</strong> / 15</span>
      <span id="progressText">进度: 0%</span>
    </div>
    <div id="quizContainer"></div>

    <div class="wrong-book" id="wrongBook">
      <h3>📕 我的错题本</h3>
      <div id="wrongList"></div>
      <button class="btn btn-wrong" onclick="retryWrong()">🔄 重练错题</button>
    </div>

    <button class="btn btn-wrong" id="showWrongBtn" onclick="showWrongBook()" style="display:none;">📕 查看错题本</button>
  </div>

  <div class="page" id="page-2">
    <div class="finish-msg show">
      <h3 id="finishTitle">🎉 恭喜通关！</h3>
      <p style="color:#555; margin:10px 0; font-size:1.08rem;">最终得分：<strong id="finalScore" style="color:#1a7a3a; font-size:1.5rem;"></strong> / 15</p>
      <div id="comment" style="margin-top:10px; font-weight:600; color:#1f5880; line-height:1.7;"></div>
      <button class="btn" onclick="location.reload()" style="margin-top:20px;">🔄 重新复习</button>
    </div>
  </div>
</div>

<script>
const learnData = [
  {
    title: '名词后缀：-tion / -ment / -able',
    en: 'noun suffixes',
    img: '核心：这些后缀常把动词或形容词变成“名词/状态/可被…的”——理解它们就像看词的“职业牌”。',
    origin: '例：action(行动), movement(运动), sensible(明智的)',
    family: [
      ['-tion', '动作/过程/状态', 'action, decision, attention'],
      ['-ment', '动作/结果/状态', 'movement, agreement, treatment'],
      ['-able', '可…的/能…的', 'reasonable, sensible, movable']
    ]
  },
  {
    title: '认知词根：sci / cred / sens',
    en: 'knowledge & belief & feeling',
    img: '你要学会用“画面”记忆：sci = 知道，cred = 相信，sens = 感觉。它们是看单词的“入口键”。',
    origin: '例：science（科学），credit（信用/信任），sensitive（敏感的）',
    family: [
      ['sci-', '知道/学习', 'science, scientific, conscious'],
      ['cred-', '相信/信任', 'credit, credible, credential'],
      ['sens-', '感觉/感知', 'sense, sensitive, sensation']
    ]
  }
];

const quizData = [
  { q: '单词 “decision” 里，-tion 说明它通常是一个什么词？', opts: ['动词','名词','形容词','副词'], ans: 1, exp: '-tion 常把动作或过程变为名词，如 decision(决定)、action(行动)。' },
  { q: '“movement” 的核心意思最接近？', opts: ['运动/动作','书写工具','知识的过程','可理解的'], ans: 0, exp: 'movement = 运动，动作的结果/状态；-ment 常表示“动作、结果、状态”。' },
  { q: '“reasonable” 中的 -able 表示什么？', opts: ['不可能','能够/可…的','全部','相反'], ans: 1, exp: 'reasonable = 合理的，可理解的；-able 常表示“可…的，能…的”。' },
  { q: 'scientist 里的 sci- 主要表示什么？', opts: ['看见','相信','知道/研究','前进'], ans: 2, exp: 'sci- 跟 science(科学) 同源，核心意味是“知道、研究”。' },
  { q: '“credible” 最可能表示？', opts: ['可信的','有感觉的','可移动的','无知的'], ans: 0, exp: 'cred- = 相信；credible = 可信的，可靠的。' },
  { q: '“sensitive” 里 sens- 表示什么？', opts: ['走路','感觉/感知','分开','看见'], ans: 1, exp: 'sens- 是感觉，sensitive = 敏感的，善于感知的。' },
  { q: '以下哪个单词最符合 “-ment” 的用法？', opts: ['payment','kindness','happy','impossible'], ans: 0, exp: 'payment(付款) 的 -ment 形成名词，表示“结果/行为/状态”。' },
  { q: '“attention” 中的 -tion 说明它最像什么？', opts: ['过程/动作的名词','形容词的比较级','副词','连词'], ans: 0, exp: 'attention(注意) 是“注意”这一行为/状态的名词。' },
  { q: '“sensible” 在语境里最可能是？', opts: ['明智的','看不见的','不可信的','无法移动的'], ans: 0, exp: 'sensible = 明智的，有感觉的；-ible/-able 常表“可…的，合理的”。' },
  { q: '“credit” 既可作名词，也可作动词。它最常见的核心联想是什么？', opts: ['信任/信用','方向','很多','距离'], ans: 0, exp: 'credit 与 “信用、信任”相关；cred- 反复出现于 believe / trust 相关词。' },
  { q: '“sensation” 里 sens- 带来的画面感最接近？', opts: ['心里有感觉','很远','不停运动','很难相信'], ans: 0, exp: 'sensation = 感觉、知觉。sens- 与 feeling / sense 直接相关。' },
  { q: '“movable” 更接近哪个意思？', opts: ['可移动的','可信的','科学的','不易感知的'], ans: 0, exp: 'move + -able = 可移动的。-able 常表示“可…的”。' },
  { q: '以下选项中，哪个词根和意思最匹配？', opts: ['cred- = 相信/信任','sci- = 方向/位置','sens- = 计算/图形','-ment = 工具名'], ans: 0, exp: 'cred- 是信任，sci- 是知道/研究，sens- 是感觉。' },
  { q: '“agreement” 强调什么？', opts: ['同意、协议','批评、否定','运动、跑步','知识、研究'], ans: 0, exp: 'agreement = 协议/同意；-ment 常表示行为结果或状态。' },
  { q: '“scientific” 最强的联想是？', opts: ['与科学、知识有关','与情感有关','与距离有关','与分开有关'], ans: 0, exp: 'scientific = 科学的；sci- 与知/学相关。' },
  { q: '在词根记忆法里，最重要的原则是什么？', opts: ['每个词都要字面直译','抓住词根和后缀的“画面感”','只看前缀不看后缀','只背单词不要理解'], ans: 1, exp: '词根词缀的核心是“联系词义画面”，不是机械硬翻。' }
];

const learnContainer = document.getElementById('learnContainer');
const quizContainer = document.getElementById('quizContainer');
const scoreDisplay = document.getElementById('scoreDisplay');
const progressText = document.getElementById('progressText');
const wrongBook = document.getElementById('wrongBook');
const wrongList = document.getElementById('wrongList');
const showWrongBtn = document.getElementById('showWrongBtn');
const finalScore = document.getElementById('finalScore');
const comment = document.getElementById('comment');

let currentPage = 0;
let score = 0;
let answered = [];
let wrongListData = [];

function goToPage(pageIndex) {
  const pages = document.querySelectorAll('.page');
  pages.forEach((page, index) => {
    page.classList.toggle('active', index === pageIndex);
  });

  const steps = document.querySelectorAll('.step');
  steps.forEach((step, index) => {
    step.classList.toggle('active', index === pageIndex);
    step.classList.toggle('done', index < pageIndex);
  });

  currentPage = pageIndex;
  if (pageIndex === 1) {
    renderQuiz();
  }
}

function renderLearn() {
  learnData.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'learn-card';
    card.innerHTML = `
      <div class="learn-title">${item.title}<span class="learn-en">${item.en}</span></div>
      <div class="learn-img">${item.img}</div>
      <div class="learn-origin">${item.origin}</div>
      <button class="family-toggle" onclick="toggleFamily(this)">📚 查看词族扩展</button>
      <ul class="family-list">
        ${item.family.map(([word, meaning, examples]) => `
          <li>
            <span class="fam-word">${word}</span>
            <span class="fam-break">${meaning}</span>
            <span class="fam-mean">${examples}</span>
          </li>
        `).join('')}
      </ul>
    `;
    learnContainer.appendChild(card);
  });
}

function toggleFamily(button) {
  const list = button.nextElementSibling;
  const isOpen = list.classList.toggle('open');
  button.textContent = isOpen ? '📚 收起词族扩展' : '📚 查看词族扩展';
}

function renderQuiz() {
  quizContainer.innerHTML = '';
  quizData.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.innerHTML = `
      <div class="quiz-question">${index + 1}. ${item.q}</div>
      <div class="quiz-options">
        ${item.opts.map((opt, optIndex) => `
          <button class="quiz-opt" data-index="${index}" data-opt="${optIndex}" onclick="handleAnswer(this, ${index}, ${optIndex}, ${item.ans})">${opt}</button>
        `).join('')}
      </div>
      <div class="quiz-explain" id="exp-${index}">${item.exp}</div>
    `;
    quizContainer.appendChild(card);
  });
}

function handleAnswer(button, qIndex, chosenIndex, correctIndex) {
  if (answered.includes(qIndex)) return;
  answered.push(qIndex);

  const buttons = document.querySelectorAll(`.quiz-opt[data-index="${qIndex}"]`);
  buttons.forEach((btn) => {
    const isCorrect = Number(btn.dataset.opt) === correctIndex;
    btn.disabled = true;
    if (isCorrect) btn.classList.add('correct');
    if (Number(btn.dataset.opt) === chosenIndex && chosenIndex !== correctIndex) {
      btn.classList.add('wrong');
      btn.parentElement.parentElement.classList.add('feedback-no');
    }
    if (Number(btn.dataset.opt) === correctIndex) {
      btn.parentElement.parentElement.classList.add('feedback-ok');
    }
  });

  const card = button.closest('.quiz-card');
  const exp = card.querySelector('.quiz-explain');
  exp.textContent = quizData[qIndex].exp;
  exp.classList.add('show');

  if (chosenIndex === correctIndex) {
    score += 1;
  } else {
    wrongListData.push({
      q: quizData[qIndex].q,
      a: quizData[qIndex].opts[correctIndex],
      e: quizData[qIndex].exp
    });
  }

  updateScore();
  checkFinish();
}

function updateScore() {
  scoreDisplay.textContent = score;
  const percent = Math.round((answered.length / quizData.length) * 100);
  progressText.textContent = `进度: ${percent}%`;
}

function checkFinish() {
  if (answered.length === quizData.length) {
    const finalPct = Math.round((score / quizData.length) * 100);
    finalScore.textContent = `${score}`;
    let message = '基础很稳，继续保持！';
    if (finalPct >= 90) message = '太强了，词根词缀都被你“看见”了！';
    else if (finalPct >= 75) message = '表现不错，错题本再过一遍就更稳了。';
    else if (finalPct >= 60) message = '基础已经扎实，继续把词根画面串起来。';
    else if (finalPct >= 40) message = '别急，重做错题比简单刷题更有用。';
    else message = '先别灰心，抓住“画面感”后会快很多。';
    comment.textContent = `${message} 你本轮得分 ${score} / ${quizData.length}。`;

    if (wrongListData.length > 0) {
      showWrongBtn.style.display = 'block';
    }
    setTimeout(() => {
      goToPage(2);
    }, 500);
  }
}

function showWrongBook() {
  wrongBook.classList.add('show');
  wrongList.innerHTML = '';

  if (wrongListData.length === 0) {
    wrongList.innerHTML = '<div class="wrong-item"><div class="q-text">太棒了！本轮没有错题。</div></div>';
    return;
  }

  wrongListData.forEach((item) => {
    const div = document.createElement('div');
    div.className = 'wrong-item';
    div.innerHTML = `
      <div class="q-text">Q：${item.q}</div>
      <div class="a-text">正确答案：${item.a}</div>
      <div class="e-text">解释：${item.e}</div>
    `;
    wrongList.appendChild(div);
  });
}

function retryWrong() {
  if (wrongListData.length === 0) {
    alert('本轮没有错题，继续冲刺吧！');
    return;
  }

  const retryIndexes = [];
  quizData.forEach((item, i) => {
    const hasMistake = wrongListData.some((w) => w.q === item.q);
    if (hasMistake) retryIndexes.push(i);
  });

  const questions = document.querySelectorAll('.quiz-card');
  questions.forEach((card, idx) => {
    const isRetry = retryIndexes.includes(idx);
    card.style.display = isRetry ? 'block' : 'none';
  });

  wrongBook.classList.remove('show');
  showWrongBtn.style.display = 'none';
  const allBtns = document.querySelectorAll('.quiz-opt');
  allBtns.forEach((btn) => {
    const qIndex = Number(btn.dataset.index);
    if (!retryIndexes.includes(qIndex)) {
      btn.disabled = true;
    }
  });

  const retryPrompt = document.createElement('div');
  retryPrompt.className = 'quiz-card';
  retryPrompt.innerHTML = '<div class="quiz-question">💡 错题重练：请重新做刚才的错题，��化画面记忆。</div>';
  quizContainer.prepend(retryPrompt);
}

renderLearn();
renderQuiz();
</script>
</body>
</html>
