// 渲染与逻辑区
// ==========================================

let wrongAnswers = [];
let retrying = false;
let retryIndices = [];

const flipGrid = document.getElementById('flipGrid');
prepData.forEach(p => {
  let examplesHtml = p.examples.map(e => `<li>${e}</li>`).join('');
  let html = `
    <div class="flip-card" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-front"><h3>${p.word}</h3><p>${p.tag}</p></div>
        <div class="flip-back"><p style="margin-bottom:6px; font-weight:700; color:#b16a3a;">${p.desc}</p><ul>${examplesHtml}</ul></div>
      </div>
    </div>
  `;
  flipGrid.innerHTML += html;
});

const verbFamilyContainer = document.getElementById('verbFamilyContainer');
verbFamilyData.forEach(vf => {
  let html = `<div class="verb-family"><div class="verb-title">${vf.prep}</div><ul class="verb-list">`;
  vf.verbs.forEach(v => { html += `<li><span class="verb-word">${v.w}</span><span class="verb-exp">${v.exp}</span></li>`; });
  html += `</ul></div>`;
  verbFamilyContainer.innerHTML += html;
});

function renderQuiz(indices) {
  const quizContainer = document.getElementById('quizContainer');
  quizContainer.innerHTML = '';
  indices.forEach((realIdx, displayIdx) => {
    const q = prepQuizData[realIdx];
    let html = `<div class="quiz-card" id="qcard-${displayIdx}"><div class="quiz-question">${displayIdx+1}. ${q.q}</div><div class="quiz-options">`;
    q.opts.forEach((opt, oi) => {
      html += `<div class="quiz-opt" onclick="checkPrepQuiz(${realIdx}, ${oi}, this, ${displayIdx})">${opt}</div>`;
    });
    html += `</div><div class="quiz-explain" id="prep-exp-${displayIdx}">💡 ${q.exp}</div></div>`;
    quizContainer.innerHTML += html;
  });
}

let correctCount = 0;
let answeredCount = 0;

function initQuiz() {
  wrongAnswers = [];
  retrying = false;
  correctCount = 0;
  answeredCount = 0;
  const indices = prepQuizData.map((_, i) => i);
  renderQuiz(indices);
  document.getElementById('scoreDisplay').innerText = '0';
  document.getElementById('progressText').innerText = '进度: 0%';
  document.getElementById('wrongBook').classList.remove('show');
  document.getElementById('showWrongBtn').style.display = 'none';
}

function checkPrepQuiz(realIdx, oIdx, el, displayIdx) {
  const q = prepQuizData[realIdx];
  const parent = el.parentElement;
  const card = document.getElementById(`qcard-${displayIdx}`);
  Array.from(parent.children).forEach(c => c.style.pointerEvents = 'none');
  
  if(oIdx === q.ans) {
    el.classList.add('correct');
    card.style.boxShadow = '0 0 10px rgba(40, 167, 69, 0.4)';
    correctCount++;
  } else {
    el.classList.add('wrong');
    parent.children[q.ans].classList.add('correct');
    card.style.boxShadow = '0 0 10px rgba(220, 53, 69, 0.4)';
    // 记录错题
    if(!wrongAnswers.find(w => w.idx === realIdx)) {
      wrongAnswers.push({ idx: realIdx, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
    }
  }
  
  document.getElementById(`prep-exp-${displayIdx}`).classList.add('show');
  answeredCount++;
  document.getElementById('scoreDisplay').innerText = correctCount;
  
  const total = retrying ? retryIndices.length : prepQuizData.length;
  let percent = Math.round((answeredCount / total) * 100);
  document.getElementById('progressText').innerText = `进度: ${percent}%`;
  
  if(answeredCount === total) {
    if(!retrying) {
      document.getElementById('showWrongBtn').style.display = 'block';
      if(wrongAnswers.length === 0) {
        document.getElementById('showWrongBtn').innerText = '🎉 全对！没有错题';
        document.getElementById('showWrongBtn').style.background = '#1a7a3a';
      } else {
        document.getElementById('showWrongBtn').innerText = `📕 查看错题本 (${wrongAnswers.length}题)`;
      }
    } else {
      // 重练结束
      if(wrongAnswers.length === 0) {
        document.getElementById('showWrongBtn').innerText = '🎉 错题已全部掌握！';
        document.getElementById('showWrongBtn').style.background = '#1a7a3a';
        document.getElementById('showWrongBtn').style.display = 'block';
      } else {
        document.getElementById('showWrongBtn').innerText = `📕 仍有 ${wrongAnswers.length} 题需要重练`;
        document.getElementById('showWrongBtn').style.display = 'block';
        document.getElementById('showWrongBtn').style.background = '#b13e2e';
      }
    }
  }
}

function showWrongBook() {
  const book = document.getElementById('wrongBook');
  const list = document.getElementById('wrongList');
  list.innerHTML = '';
  if(wrongAnswers.length === 0) {
    list.innerHTML = '<p style="color:#1a7a3a; font-weight:600;">🎉 恭喜你，没有错题！</p>';
  } else {
    wrongAnswers.forEach(w => {
      const correctLetter = String.fromCharCode(65 + w.ans);
      list.innerHTML += `<div class="wrong-item">
        <div class="q-text">${w.q}</div>
        <div class="a-text">✅ 正确答案：${correctLetter}. ${w.opts[w.ans].replace(/^[A-D]\.\s*/, '')}</div>
        <div class="e-text">💡 ${w.exp}</div>
      </div>`;
    });
  }
  book.classList.add('show');
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function retryWrong() {
  if(wrongAnswers.length === 0) return;
  retrying = true;
  retryIndices = wrongAnswers.map(w => w.idx);
  // 保留错题，但清空本轮错题记录以便重新算
  const retryQs = wrongAnswers.map(w => ({...w}));
  wrongAnswers = [];
  correctCount = 0;
  answeredCount = 0;
  
  // 隐藏错题本
  document.getElementById('wrongBook').classList.remove('show');
  document.getElementById('showWrongBtn').style.display = 'none';
  
  // 只渲染错题
  const quizContainer = document.getElementById('quizContainer');
  quizContainer.innerHTML = '';
  retryIndices.forEach((realIdx, displayIdx) => {
    const q = prepQuizData[realIdx];
    let html = `<div class="quiz-card" id="qcard-${displayIdx}"><div class="quiz-question">${displayIdx+1}. ${q.q}</div><div class="quiz-options">`;
    q.opts.forEach((opt, oi) => {
      html += `<div class="quiz-opt" onclick="checkPrepQuiz(${realIdx}, ${oi}, this, ${displayIdx})">${opt}</div>`;
    });
    html += `</div><div class="quiz-explain" id="prep-exp-${displayIdx}">💡 ${q.exp}</div></div>`;
    quizContainer.innerHTML += html;
  });
  document.getElementById('scoreDisplay').innerText = '0';
  document.getElementById('progressText').innerText = '进度: 0%';
}

function clearWrong() {
  initQuiz();
}

const tabBtns = document.querySelectorAll('.tab-btn');
const cards = document.querySelectorAll('.card');
tabBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    const idx = this.dataset.tab;
    tabBtns.forEach(b => b.classList.remove('active'));
    cards.forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('card-' + idx).classList.add('active');
  });
});

initQuiz();
</script>
</body>
</html>
